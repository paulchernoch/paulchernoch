<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lady Wisdom's House</title>
<link rel="stylesheet" href="./styles/colors.css" type="text/css">

<style>
/* ============================================================
   Root / reset
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--dark-cerulean);
  color: #e8f0f5;
  font-family: "Segoe UI", Optima, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;   /* prevent page-level scroll; carousel owns it */
}

/* ============================================================
   Blueprint watermark overlay
   ============================================================ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ============================================================
   Header
   ============================================================ */
.site-header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 12px 24px 10px;
  background: linear-gradient(135deg, #0a2a52 0%, #154085 60%, #1a5080 100%);
  border-bottom: 2px solid var(--coral-blue);
  box-shadow: 0 3px 14px rgba(0,0,0,.55);
  flex-shrink: 0;
}

.site-header a.logo-link {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.site-header img.logo {
  height: 64px;
  width: auto;
  border: 1px solid var(--coral-blue);
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(162,222,237,.4);
}

.header-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.site-title {
  font-family: Optima, "Palatino Linotype", Georgia, serif;
  font-size: clamp(1.4rem, 4vw, 2.4rem);
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--chiffon);
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

.site-subtitle {
  font-size: clamp(.75rem, 1.8vw, 1rem);
  color: var(--sea-mist);
  font-style: italic;
  letter-spacing: .02em;
}

/* ============================================================
   Carousel wrapper
   ============================================================ */
.carousel-wrapper {
  position: relative;
  z-index: 5;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 20px 0 12px;
}

/* ============================================================
   Track — HORIZONTAL (tablet / desktop landscape)
   ============================================================ */
.track {
  display: flex;
  width: max-content;
  gap: 20px;
  padding: 8px 24px 16px;
  cursor: grab;
  user-select: none;
}
.track:active { cursor: grabbing; }

/* ============================================================
   VERTICAL layout for portrait / narrow phones
   ============================================================ */
@media (max-aspect-ratio: 3/4) {
  body { overflow: hidden; }

  /* Pull the track out of flex flow so it can be taller than the wrapper
     and get moved upward with translateY without flexbox constraining it.
     .carousel-wrapper already has position:relative and overflow:hidden. */
  .track {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    width: auto !important;   /* let left/right constraints set the width */
    flex-direction: column;
    padding: 8px 16px 16px;
    gap: 16px;
  }

  .tile {
    width: 100% !important;
    min-height: unset;
  }
}

/* ============================================================
   Tiles
   ============================================================ */
.tile {
  flex-shrink: 0;
  width: clamp(260px, 30vw, 380px);
  min-height: 280px;
  background: linear-gradient(160deg, #0e3a6a 0%, #0b2d55 100%);
  border: 1px solid var(--coral-blue);
  border-radius: 8px;
  padding: 20px 18px 16px;
  box-shadow:
    0 4px 18px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(162,222,237,.15);
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: box-shadow .25s, border-color .25s, transform .2s;
  position: relative;
  overflow: hidden;
}

/* Blueprint corner accent */
.tile::before {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 36px; height: 36px;
  border-top: 2px solid var(--light-gray-teal);
  border-right: 2px solid var(--light-gray-teal);
  border-radius: 0 8px 0 0;
  opacity: .5;
  pointer-events: none;
}
.tile::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0;
  width: 36px; height: 36px;
  border-bottom: 2px solid var(--light-gray-teal);
  border-left: 2px solid var(--light-gray-teal);
  border-radius: 0 0 0 8px;
  opacity: .5;
  pointer-events: none;
}

.tile:hover,
.tile.paused-hover {
  border-color: var(--light-gray-teal);
  box-shadow:
    0 6px 28px rgba(0,0,0,.7),
    0 0 0 2px rgba(136,192,196,.35),
    inset 0 1px 0 rgba(162,222,237,.25);
  transform: translateY(-3px);
}

.tile-title {
  font-family: Optima, "Palatino Linotype", Georgia, serif;
  font-size: clamp(.95rem, 1.8vw, 1.15rem);
  font-weight: 700;
  color: var(--chiffon);
  line-height: 1.25;
  border-bottom: 1px solid rgba(162,222,237,.25);
  padding-bottom: 6px;
}

.tile-sub {
  font-size: .82rem;
  font-style: italic;
  color: var(--sea-mist);
  letter-spacing: .02em;
}

.tile-synopsis {
  font-size: clamp(.78rem, 1.4vw, .9rem);
  line-height: 1.55;
  color: #c8dce8;
  flex: 1 1 auto;
  overflow: hidden;
  /* Subtle gradient fade if text overflows */
  -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
}

/* ============================================================
   Progress pip strip
   ============================================================ */
.pip-strip {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 6px 0 10px;
  flex-shrink: 0;
}

.pip {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(162,222,237,.3);
  transition: background .3s;
}
.pip.active {
  background: var(--coral-blue);
}

/* ============================================================
   Pause indicator
   ============================================================ */
.pause-badge {
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 20;
  background: rgba(10,40,80,.85);
  border: 1px solid var(--coral-blue);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: .78rem;
  color: var(--sea-mist);
  letter-spacing: .04em;
  opacity: 0;
  transition: opacity .35s;
  pointer-events: none;
}
.pause-badge.visible { opacity: 1; }
</style>
</head>

<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header class="site-header">
  <a class="logo-link" href="home.html" aria-label="Go to Home">
    <img class="logo" src="images/wisdom-house.png" alt="Lady Wisdom's House logo"/>
  </a>
  <div class="header-text">
    <div class="site-title">Lady Wisdom's House</div>
    <div class="site-subtitle">Exploring biblical wisdom, prophetic patterns, and the architecture of Scripture</div>
  </div>
</header>

<!-- ============================================================
     Carousel
     ============================================================ -->
<div class="carousel-wrapper" id="carouselWrapper">
  <div class="track" id="track" role="list" aria-label="Article index"></div>
</div>

<!-- Progress pips -->
<div class="pip-strip" id="pipStrip" aria-hidden="true"></div>

<!-- Pause badge -->
<div class="pause-badge" id="pauseBadge">⏸ paused</div>

<!-- ============================================================
     Embedded JavaScript — no external libraries
     ============================================================ -->
<script>
/* ---- timing constants (generated from Python) ---- */
const SCROLL_PAUSE_MS  = 5000;
const RESUME_IDLE_MS   = 15000;
const SCROLL_SPEED     = 80;   /* px / second */

/* ---- article data (shuffled on load) ---- */
const ARTICLES = [
  {title:'120 is for Consecration', sub:'', synopsis:'The number 120 carries a dual meaning throughout Scripture: consecration for service and divine judgment. From the 120 priests blowing trumpets at Solomon\'s temple dedication to the 120 believers present at Pentecost, the number marks people set apart by God. It factors as 10 x 12, combining secular and consecrated completeness, and as 3 x 40, three periods of trial and testing. The article traces 120 from Genesis to Revelation, concluding that consecration and judgment are two sides of the same coin — and that 144,000 = 120 x 120 x 10 seals this meaning in the end-times drama.', href:'120-is-for-consecration.html'},
  {title:'153 and Fear', sub:'', synopsis:'Through calendar arithmetic applied to the dates of Noah\'s Flood, this article reveals a surprising link between the number 153 and the biblical theme of fearing the Lord. The flood began on the 17th of the 2nd month and ended on the 17th of the 7th month, and (17 x 2) + (17 x 7) = 153, pointing directly to Psalms 34 and 119 — the two chapters in Scripture most focused on the fear of the Lord. Additional reinforcement comes from Luke 12 and 2 Kings 17, both chapters freighted with the word fear. The article concludes that the flood itself was designed to teach mankind to fear God, making 153 a number encoding that reverent awe.', href:'153-and-fear.html'},
  {title:'153 and Hope', sub:'', synopsis:'Starting with Jeremiah\'s purchase of property for seventeen shekels as Jerusalem fell to Babylon, this article shows how the number seventeen — a factor of 153 — carries a meaning of hope amid catastrophe. A careful count of the word deed in Jeremiah 32 reveals a hidden 9 x 17 = 153 structure, tying the chapter to John 21\'s miraculous catch. Prophetic timelines then trace multiples of seventeen from Jerusalem\'s fall in 586 BC to its liberation in 1917 and Israel\'s rebirth in 1948. Seventeen, and by extension 153, thus means victory over sin and hope for restoration — even when no evidence of that hope can yet be seen.', href:'153-and-hope.html'},
  {title:'153 and the Fifth Trumpet', sub:'', synopsis:'This article connects the 153-day duration of Noah\'s Flood to the five months of the fifth trumpet in Revelation 9, interpreting each prophetic day as one year for a total of 153 years. The locusts of Revelation — crowned, with women\'s hair and iron breastplates — are identified as the Christian queens of European colonial empires during the Industrial Revolution (1765-1918). That 153-year period fulfilled Habakkuk\'s prophecies against Islamic civilization, culminating in Britain\'s capture of Jerusalem in 1917 and the dissolution of the Ottoman Empire. The article demonstrates that these locusts distinguished between those sealed by God and all other peoples, exactly as the biblical text demands.', href:'153-and-the-fifth-trumpet.html'},
  {title:'153 Connections', sub:'', synopsis:'This introductory article to a multi-part series reveals the author\'s discovery of a sweeping connection between the 153 fish in John 21, the prophecies of Habakkuk, and the fifth trumpet of Revelation 9. After correcting an earlier error in calculating the five months of Revelation using queens\' reign durations, studying Noah\'s Flood provided the true solution: 153 days equals five 30-day months. John 21\'s fishing miracle shares key themes with Habakkuk — nets, fish, nakedness, and sheep — connecting them through a web of shared imagery. The article serves as a map to the multi-part inquiry that will untangle the meaning of 153 across Genesis, Psalms, Jeremiah, Matthew, John, Habakkuk, and Revelation.', href:'153-connections.html'},
  {title:'153 is for Total Victory', sub:'', synopsis:'This overview article introduces a multi-part series exploring the number 153, which the author identifies as a symbol of total victory drawn from the miraculous catch of fish in John 21. The series traces 153 across six key meanings: total victory, the fear of God, hope amid war, judgment for the wicked, forgiveness for the righteous, and power for the righteous. As the seventeenth triangular number (1+2+...+17=153), the number links Habakkuk\'s seven-section structure to themes of victory, since the 17th verses of all three chapters of Habakkuk address the triumph of good over evil. Readers are directed to individual articles in the series that develop each of these themes in depth.', href:'153-is-for-total-victory.html'},
  {title:'17 is for Victory', sub:'', synopsis:'The number seventeen encodes the biblical theme of divine victory over human opposition, being the sum of seven (divine completeness) and ten (human completeness). The beast of Revelation 13 has seven heads and ten horns — seventeen combined — representing the enemy that God will vanquish, while Paul lists seventeen adversaries in Romans 8 that believers overcome through Christ. The most dramatic example is Noah\'s Flood, which began and ended on the seventeenth day of different months, marking God\'s total triumph over human wickedness. By century, by month, and by day, seventeen consistently signals God\'s victorious hand at work in history.', href:'17-is-for-victory.html'},
  {title:'2 is for Jesus', sub:'', synopsis:'The number two in Scripture points to Jesus Christ — the Word of God given in two testaments, a man of two natures (divine and human) who will visit the world twice. Psalm 2 prophesies of Jesus as God\'s anointed, begotten Son who will rule the nations with a rod of iron, inviting all to kiss the Son lest his wrath be kindled. In the Gospels, two people literally kiss Jesus: Mary of Bethany in loving gratitude and Judas in betrayal, precisely fulfilling the Psalm\'s dual promise of refuge for the humble and wrath for the treacherous. The number two thus captures the complete arc of Christ\'s relationship with humanity: an offer of peace now and a judgment to come.', href:'2-is-for-jesus.html'},
  {title:'210 is for Peace', sub:'', synopsis:'The number 210 is connected to the lifespan of Job, who — adding seventy years before his trials to the 140 years of restored blessing — lived to age 210. The article shows that 210 = 42 x 5, with forty-two representing the struggle leading to victory and five the grace of a harvest, a perfect description of Job\'s journey from suffering to restoration. Breaking the number down further as 2 x 3 x 5 x 7 connects it to all three persons of the Trinity, each of whom played a distinct role in Job\'s transformation. When Job died old and full of days, Scripture declared his peace, making 210 the number for a life of hard-won peace.', href:'210-is-for-peace.html'},
  {title:'28 is for Time', sub:'', synopsis:'The number twenty-eight structures the Seven Pillars of Wisdom books — Psalms, Job, Proverbs, Song of Songs, and others — by mapping twenty-eight times from Ecclesiastes 3 onto each book\'s chapters or major sections. The article dismisses common biblical trivia about the number and focuses instead on how the Growth Pattern of twenty-eight phases traces either a spiral upward toward heavenly peace or a downward spiral into ruin. Each pillar book demonstrates this structure differently: Psalms 1-28, Job chapters 15-42, Proverbs chapters 4-31, and Song of Songs\' twenty-eight alternating speeches. Twenty-eight thus serves as a divine temporal map of the soul\'s journey through life\'s seasons, linked to the lunar cycle and the rhythms of time itself.', href:'28-is-for-time.html'},
  {title:'3 is for the Father', sub:'', synopsis:'The number three in Scripture most powerfully signifies the triune God, especially God the Father, whose past-present-future existence — who was, and is, and is to come — is expressed as a threefold formula in both Revelation 1 and 4. Of the five numbers of completeness in Scripture (3, 7, 10, 12, 70), three stands for completeness in divine power and holiness. The article connects three to Psalm 3, where David faces a threefold increase of enemies but has a threefold reliance on God, and the word Selah appears three times as an invitation to wait on the Father. Even in creation, dry ground appearing on the third day — earth that remains forever — points to God the Father as our immovable, eternal foundation.', href:'3-is-for-the-father.html'},
  {title:'4 is for Cycles of Nature', sub:'', synopsis:'The number four represents the eternal, faithful cycles of nature — the four seasons, the four directions, and the creation of the sun, moon, and stars on the fourth day to mark off days and years. In Ecclesiastes 1, Solomon meditates on four endless cycles that match the four ancient elements: earth, sun (fire), wind (air), and rivers (water). God\'s promise to Noah after the Flood names four pairs of opposites — seedtime and harvest, cold and heat, summer and winter, day and night — declaring that these faithful cycles will continue as long as the earth endures. Where seven signifies progression toward completion, four signifies faithful repetition — the farmer\'s friend and the philosopher\'s restless lament.', href:'4-is-for-cycles-of-nature.html'},
  {title:'40 is for Suffering', sub:'', synopsis:'Forty is among the most consistent of biblical numbers, appearing in story after story with the same unambiguous meaning: suffering, trials, and temptation. Moses spent forty years in each of three phases of his life; Noah\'s Flood lasted forty days; Jesus fasted forty days in the wilderness; David, Solomon, and Josiah each reigned forty years through conflict-laden eras. The number factors as 10 x 4 — fallen human completeness multiplied by nature\'s endless repetition — showing that trials come not once but in waves. The article also notes that forty centuries from creation reaches approximately 20 BC, forty centuries during which the whole world was tested without a Savior.', href:'40-is-for-suffering.html'},
  {title:'42 is for the Journey', sub:'', synopsis:'Forty-two is the number of struggle and the journey back to God, drawn from Israel\'s forty-two stages of desert wandering, Matthew\'s forty-two-name genealogy from Abraham to Jesus, and Revelation\'s symbolic forty-two months of tribulation. Factoring as 6 x 7 — man\'s rebellion opposed by God\'s perfection — forty-two measures how long the battle between good and evil will continue before its final resolution. A second meaning emerges from the Hebrew word for God, Eloah, whose letters sum to 42, making forty-two literally the measure of the immeasurable God. From Nimrod\'s tower to Israel\'s wandering to Jesus\' genealogy, forty-two invariably traces the path through suffering that leads to God\'s ultimate victory.', href:'42-is-for-the-journey.html'},
  {title:'5 is for Grace', sub:'', synopsis:'Five is the number of grace, most clearly seen in the five Levitical offerings — burnt, grain, purification, guilt, and peace — which correspond to five stages of God\'s path from suffering to peace. The article connects this to Noah, Ruth, and David, each of whom found favor (grace) in God\'s eyes at the fifth mention of their name in Scripture. In the five books of the Pentateuch, five comes alive as the shape of God\'s discipling path: preparation, plowing through suffering, planting the Word, pouring out the Spirit, and finally peace. Even in creation, the fifth day\'s birds and sea creatures reflect the Holy Spirit battling Leviathan — wherever five appears, God\'s grace is at work in the midst of conflict.', href:'5-is-for-grace.html'},
  {title:'6 is for Man', sub:'', synopsis:'Six is the number of man and trouble, since humanity was created on the sixth day alongside the beasts that represent evil empires in biblical prophecy. The sixth commandment is against murder, the most violent and irreversible breach of God\'s law; six cities of refuge were established by Moses to protect the accused from mob vengeance pending a fair trial. The Antichrist\'s number is 666, a complete trinity of evil, showing humanity\'s rebellion at its most organized and dangerous. Rome, the sixth and longest-lasting of the major world empires in Daniel\'s sequence, represents human civilization at its most powerful — an empire of iron teeth that devoured and crushed all it encountered.', href:'6-is-for-man.html'},
  {title:'7 is for the Holy Spirit', sub:'', synopsis:'Seven is one of the most frequent numbers in Scripture, carrying meanings of completeness, holiness, consecration, and the omnipresence of the Holy Spirit through its identification with the seven spirits of God named in Isaiah 11 and Revelation. Zechariah\'s vision of the seven-lamp menorah — interpreted as the seven eyes of the Lord ranging through the whole earth — is taken up by John, who identifies the Lamb\'s seven eyes with the seven spirits of God sent into all the earth. These seven spirits (wisdom, understanding, counsel, might, knowledge, fear of the Lord, and the Spirit of the Lord himself) each illuminate one of the Seven Pillars of Wisdom. Even in nature, the gestational periods of many animals — mice, sheep, dogs, and humans — are multiples of seven days, showing that seven is woven into the very fabric of life.', href:'7-is-for-the-holy-spirit.html'},
  {title:'A Divided World', sub:'', synopsis:'Using Solomon\'s clock of twenty-eight times from Ecclesiastes 3, this article argues that the world is currently in a time to love and is transitioning toward a time to hate beginning around 2040 AD — a period that will bring intensifying division, persecution, and conflict for Jews and Christians alike. The article points to alarming statistics: a 360% rise in antisemitic incidents following the October 2023 Hamas attacks and an eightfold increase in attacks on Christian churches between 2018 and 2023. Yet God is not surprised — Matthew 13\'s parable of the net teaches that this separation of good and evil is an essential feature of the end-times harvest, not a catastrophe but a divine sorting. The article ends with encouragement that God foresaw all of this and provides the help needed to endure it, if we trust His word, His wisdom, and His will.', href:'a-divided-world.html'},
  {title:'A Model for the Ordination of Women', sub:'', synopsis:'This article argues that while the author accepts the constraints of complementarian passages in 1 Timothy and Ephesians, those constraints do not preclude the possibility that God has ordained women for service — if a proper biblical model of such ordination can be found. Accepting that Christ\'s death did not immediately open pastoral and elder roles to women, the article sets out six things that must be demonstrated in Scripture: a sacrifice, a ceremony, a prophetic metaphor proving the ceremony applies to women, a prophetic timeframe, a reinterpretation of the restrictive texts, and an explanation for the long delay. The rest of the series examines Job\'s ordination, the metaphor of childbirth, and Paul\'s letters to supply those answers. The article functions as a compass pointing toward the following articles in the series.', href:'a-model-for-the-ordination-of-women.html'},
  {title:'About this Website', sub:'', synopsis:'This page introduces the website and its purpose, explaining that it presents organized, carefully considered insights on the Christian faith — not a blog of random thoughts. The site covers two major themes: advice for personal spiritual growth (drawing from the author\'s own healing from depression, anxiety, and fear) and a novel system of eschatology that sees the structure of individual human life as a mirror of all human history. Navigation features include a table of contents, full-text search, a Scripture index, and section links connecting related articles. The author\'s doctrinal statement reflects Reformed Baptist convictions, belief in the gifts of the Spirit, Young Earth Creationism, and a recently adopted egalitarian position on women\'s ordination.', href:'about.html'},
  {title:'The Acrostic Clock', sub:'', synopsis:'Psalms 111 and 112 form an Acrostic Clock — an interlocking pair of Hebrew acrostics where each poetic line begins with a successive letter of the alphabet, mapping forty-four poetic lines to forty-four eras of history. Psalm 111 speaks of the Lord while Psalm 112 mirrors him in the life of the upright person, with the fear of the Lord as the hinge between them. The pair carries the fingerprints of all seven spirits of God and connects to Psalm 119\'s prophetic clock through its acrostic structure. Examining the era from 642 to 684 AD in this clock\'s light illuminates Islam\'s assault on the Trinity, the capture of Jerusalem, and the beginning of the Dark Ages through the psalm\'s imagery of light dawning in darkness.', href:'acrostic-clock.html'},
  {title:'Against Complementarianism', sub:'', synopsis:'This article recounts the author\'s dramatic reversal from a lifelong complementarian position to an egalitarian one, offering a declaration-against-interest — the testimony of someone who stood to lose friends and reputation by changing — as proof that the change was genuine. Three errors in Kathy Keller\'s complementarian booklet are identified: an overly simplistic appeal to scriptural perspicacity, an admission of ignorance about God\'s purpose for women\'s suffering, and an implicit assumption that God has not revealed his plan for women\'s liberation. The article argues that God has indeed revealed this plan — hidden in biblical patterns that require diligent search — and that the church has been spiritually deaf to it. It promises to show a biblical model of ordination that satisfies even the constraints Keller herself would accept.', href:'against-complementarianism.html'},
  {title:'The Death of Alexander the Great', sub:'', synopsis:'Using the speech of Zophar in Job 20, this forensic investigation proposes that Alexander the Great\'s mysterious death is described in prophetic detail in the Bible, centuries before it occurred. Verse by verse, Zophar\'s description of the fate of the wicked maps onto the documented symptoms of Alexander\'s illness: the banquet where it began, excruciating abdominal pain, fever, jaundice, delirium, convulsions, and creeping paralysis leading to death within two weeks. The article identifies Zophar with Satan and explains that just as Revelation 13 shows Satan controlling the world\'s evil empires, Job 20 is the devil\'s own funeral oration for his fallen servant Alexander. The solution to one of history\'s great medical mysteries is thus found not in a modern journal but in the oldest book of the Bible.', href:'alexander-the-great.html'},
  {title:'About the Author', sub:'', synopsis:'Paul Anton Chernoch introduces himself as a physics graduate of MIT, a software engineer, and a theologian who has spent over thirty years in prayer, fasting, and Scripture study in pursuit of God\'s wisdom. He describes a series of extended prayer campaigns over decades — for wisdom, freedom from fear, generosity, and the glory of God — each answered in surprising ways that produced the books and articles on this site. His MIT education sharpened the analytical mind that he brings to the Bible\'s mathematical and structural patterns, while his classes at Gordon-Conwell deepened his theological foundations. The page is less a biography than a testimony that the wisdom on this site was given by God to a man who asked persistently and was answered abundantly.', href:'author.html'},
  {title:'Blueprint for Lady Wisdom\'s House', sub:'', synopsis:'This article presents the architectural metaphor of Lady Wisdom\'s House from Proverbs as a literal map of how the Bible\'s wisdom is organized and interconnected, with foundation, seven pillars, and roof each corresponding to biblical structures. The foundation is the Law (the five books of Moses), symbolized by lapis lazuli; the seven pillars are Psalms, Job, Proverbs, Song of Songs, Ecclesiastes, Matthew, and Revelation, unified by the Growth Pattern of twenty-eight times and the sevenfold Harvest Pattern. The pillars are arranged in Harvest Pattern order — from Psalms (Preparation) through Job (Plowing), Proverbs (Planting), Song of Songs (Watering), Ecclesiastes (Plucking), Matthew (Producing), to Revelation (Peace). Jesus\' saying that something greater than Solomon is here is explained by showing how his Harvest Pattern governs the arrangement of all seven pillars, making Christ\'s wisdom surpass Solomon\'s.', href:'blueprint.html'},
  {title:'Books by Paul Anton Chernoch', sub:'', synopsis:'This page presents all of Paul Chernoch\'s published books with descriptions and Amazon purchase links, spanning fiction and nonfiction. Fiction includes A Most Refined Dragon (2015), a fantasy romance about a doctor who soul-swaps with a dragon on an alien world. Nonfiction works include The Endless Hunt (2012), a personal search for the twelve heavenly treasures Jesus described; Job Rises (2019), which draws thirteen keys to resilience from the Book of Job; and the two-volume prophetic study Peace, like Solomon Never Knew and Plague, Precept, Prophet, Peace, which together develop the author\'s system of prophetic clocks and biblical numerology. All books are available as e-books on Amazon, with most also in paperback.', href:'books.html'},
  {title:'Building a House', sub:'', synopsis:'Ecclesiastes 10 is decoded as an extended metaphor about building a house, with each parable in the chapter — from digging a pit to hammering a roof — corresponding to a stage of construction and prophesying an era of world history from 880 to 2080 AD. The author\'s theory of Fractal Historicism is applied to show how the same twenty-eight-times pattern governs both an individual human life and the whole of human history simultaneously. The productive years of the Grand Father Clock (880-2080 AD), divided into twelve 100-year eras, correspond to Ecclesiastes chapter 10 and its parables about wise and foolish work. Each building parable is shown to prophesy a specific era of civilization, from the fall of Charlemagne\'s empire to the rise of modern democratic and technological society.', href:'building-a-house.html'},
  {title:'Celestial Clocks', sub:'', synopsis:'This article surveys nineteen celestial prophetic clocks — structures where each prophetic era covers the same span of years, governed by the motions of the heavenly bodies. Each clock is named, its Scripture source identified, its timespan and period given, and its most significant prophecies noted. Major clocks include the Creation Clock (seven 1,000-year days), the Temple Dedication Clocks (twenty-two 120-year intervals from Solomon), Solomon\'s Celestial Clock (twenty-eight 120-year periods from 960 BC), and the Master Psalm Clock (fifty 42-year periods). Together these clocks form a comprehensive prophetic system covering all of history from creation to Christ\'s return, with a newly discovered Order of Salvation Clock based on the Beatitudes and Psalm 19 added to the catalog.', href:'celestial-clocks.html'},
  {title:'The Chronology of Judges', sub:'', synopsis:'This article tackles the thorny chronological puzzle of the era of the Judges by proposing a consistent set of seven rules that reconcile all major constraints without distorting the biblical text. Key innovations include treating Joshua as a teenager during the Exodus so his rule spans a full Jubilee cycle, treating periods of oppression as carved out of the preceding judgeship rather than added separately, and limiting Saul\'s reign to twelve years based on the timeline of the Ark of the Covenant. The resulting chronology fits within the 480 years from the Exodus to Solomon\'s temple given in 1 Kings 6:1 while honoring the 300-year figure from Jordan to Jephthah in Judges 11. The article is a distillation of two chapters from Plague, Precept, Prophet, Peace that established this framework.', href:'chronology-of-judges.html'},
  {title:'Chronology', sub:'', synopsis:'This overview article on biblical chronology explains why God designed the Bible\'s timeline to be estimable but not exact — reserving precise knowledge for the diligent — and describes the author\'s goal of establishing dates accurate to within a decade. The key insight is that genealogical records round down each father\'s age at a son\'s birth, causing a cumulative undercount of about ten years across twenty pre-Abrahamic generations, placing the creation at approximately 4020 BC rather than Ussher\'s 4004 BC. Two uses of time in biblical prophecy are distinguished: exact countdowns that demand precision (like Daniel\'s seventy weeks) and prophetic clocks that tolerate small errors in start dates (like Solomon\'s twenty-eight times). Articles linked from this page cover the creation date, the sojourn in Egypt, the judges, and Solomon\'s lifespan.', href:'chronology.html'},
  {title:'Commandment Clocks', sub:'', synopsis:'This article describes five prophetic clocks structured according to the Ten Commandments, where each era corresponds to one commandment and contains a historical event that violates or honors that law. The most striking example is Moses\' Commandment Clock for the Church, which maps the Black Plague of the 14th century — with its signature boils — to the sixth Exodus plague and the sixth commandment against murder, as God\'s judgment for the church\'s violence in the Crusades and Inquisition. A parallel clock for Israel spans from the Exodus to the death of Christ, with 148-year periods matching three to four Israelite generations. Job\'s Empire Clock extends the pattern across all of human history, matching each of ten major world empires to the commandment they most grievously violated.', href:'commandment-clocks.html'},
  {title:'Consecration', sub:'Models of Ordination', synopsis:'This article surveys biblical models for ordination — from Melchizedek to the Aaronic priesthood to the apostles — before focusing on an often-overlooked model: the ordination of Job. After Job\'s friends offer a burnt offering at God\'s command, God empowers Job to forgive their sins, making Job the first person in the Bible explicitly authorized to grant forgiveness to others — a priestly act. This event is shown to parallel the Levitical ordination ceremony step by step: sacrifice, ceremony, divine appointment, and delegation of authority. The article argues that this Joban model of ordination, combined with a prophetic metaphor involving childbirth, provides the biblical foundation for understanding how women came to be ordained.', href:'consecration.html'},
  {title:'Contact the Author', sub:'', synopsis:'A brief, warmly written contact page that provides the author\'s email address in a playful, spam-resistant format, asking readers to begin their subject line with \'Wisdom:\' to avoid being swallowed by the bottomless pit of junk mail. The tone is humorous but genuine, reflecting the author\'s desire to hear from readers who have been challenged or blessed by the articles on the site.', href:'contact.html'},
  {title:'Daily Scryptoquote', sub:'', synopsis:'The Daily Scryptoquote is an interactive cryptogram puzzle where a Scripture verse is encoded each day using a letter-substitution cipher, and visitors type in their letter guesses to decode it. Correct guesses propagate throughout the puzzle, and players can start over or reveal the answer using on-screen buttons. The feature is powered by the open-source Gryptocram JavaScript library and presents a different Bible verse every day with a randomly chosen cipher. The author shares his childhood love of newspaper cryptoquotes, which he often solved in under three minutes, and invites readers to test their own speed.', href:'daily-scriptoquote.html'},
  {title:'Dating the Creation', sub:'', synopsis:'This article works through the biblical genealogies and chronological guardrails — the 400-year Egyptian affliction, the 430-year sojourn, the 300 years from Jordan to Jephthah, and the 480 years from the Exodus to Solomon\'s temple — to establish a creation date of approximately 4020 BC. A detailed table traces Anno Mundi years from Adam through the patriarchs to Solomon\'s temple, with corrections for the rounding errors introduced when genealogical ages are recorded as whole numbers. The key innovation is applying non-accession-year rounding corrections to the pre-Abrahamic genealogies, adding roughly ten years to Ussher\'s 4004 BC estimate. The result is a chronology calibrated for prophetic clock use rather than absolute precision.', href:'dating-the-creation.html'},
  {title:'Defining 153', sub:'', synopsis:'This article establishes the precise duration of Noah\'s Flood as 153 days by analyzing the calendrical mathematics of the flood\'s start (17th of the 2nd month) and end (17th of the 7th month). Since a 152-day span cannot arise from any pair of consecutive calendar months, and seven of the eleven possible start months yield exactly 153 days — including theologically favored months like Nisan and Tishri — the 153-day conclusion has both mathematical probability (63%) and theological support. As the seventeenth triangular number (1+2+...+17=153), this connects the flood\'s duration to the number 17, which means victory — God\'s total victory over human wickedness. This discovery is the key to unlocking the meaning of the 153 fish in John 21 and the five months of the Revelation 9 locusts.', href:'defining-153.html'},
  {title:'A Discipleship Model', sub:'', synopsis:'The author introduces a forthcoming series of three books on Christian discipleship, dividing the subject into speaking with God, salvation, and sanctification within the framework of the twelve-step Ordo Salutis of the Reformed tradition. The first book, The Redeemed Shall Talk, addresses Illumination — the spiritual awakening that makes hearing God clearly possible and that must precede all discipleship. The second book, The Redeemed Shall Walk, covers the full plan of Salvation — all twelve steps from election to glorification. A third book, The Redeemed Shall Grow, will map the milestones of Christian growth after initial salvation, drawing on Solomon\'s Growth Pattern and Jesus\' Harvest Pattern.', href:'discipleship-model.html'},
  {title:'Seven Facets of Spirit-led Discipleship', sub:'', synopsis:'This article describes seven spirit-led facets of discipleship, each corresponding to one of the seven spirits of God named in Isaiah 11, discovered by the author during a period of illness and refined through months of study in Paul\'s letters. The seven facets — Center, Cost, Content, Clarity, Course, Communion, and Courage — constitute not a checklist but a living process in which the Holy Spirit changes the disciple\'s value system, making the treasures of heaven more desirable than anything the world offers. The author\'s personal testimony of memorizing the Sermon on the Mount, searching for heavenly treasures, and being guided through prayer and suffering illustrates each facet. Paul\'s seven letters from Romans to Colossians are shown to map the same course of discipleship in sequence.', href:'discipleship.html'},
  {title:'Dreams', sub:'', synopsis:'This article classifies twenty-one types of dreams found in Scripture — from divine promises, commands, and warnings to nightmares from the enemy, day-residue visions, and prophetic lies — and offers practical guidance on how to interpret them safely. The author\'s own experience includes a healing dream from God in 1985 that permanently cured his fear of death, as well as costly episodes of heeding false dreams that led him astray. The central warning is that one should never act solely on the basis of a dream; every dream must be weighed against Scripture, other sources of wisdom, and whether it bears good fruit. The article emphasizes that only Daniel was granted understanding of all visions and dreams, making humility and caution the essential posture for everyone else.', href:'dreams.html'},
  {title:'Emotional Prophecies of the Psalms', sub:'', synopsis:'This article presents the stunning claim that the Psalms contain not just historical and Messianic prophecies but emotional prophecies — God\'s foreknowledge of how his people would feel in every era of history, expressed thousands of years in advance. The author discovered during his study of the Psalter that each major section (Psalms 1-110, the Acrostic Clock, the Final Ascent, and Psalms 1-28 in the Growth Pattern) prophesies not only events but emotional states — a form of prophetic empathy unlike anything previously identified. This means the Psalms are not merely comfort for generic human suffering but targeted emotional care for people in particular eras, showing that God knows exactly how a twenty-first century believer will feel and has prepared a response. The discovery transformed the author\'s understanding of the Psalms from analytical to deeply personal, revealing the astonishing compassion of God for the most frail aspects of our humanity.', href:'emotional-prophecies-of-the-psalms.html'},
  {title:'Empire Clocks', sub:'', synopsis:'This article describes four Empire Clocks — prophetic structures that follow a sequence of world empires rather than equal time periods — covering Daniel\'s dream of the statue, the seven kingdoms of Revelation, Job\'s Empire Clock, and Habakkuk\'s Clock. Empires are symbolized throughout Scripture as beasts, metals, trees, or military insignia, each symbolic category capturing a different dimension: behavior (beasts), splendor (metals), and fruit (vegetation). A main sequence of ten empires from Babel to Leviathan appears across the prophets, most of which captured Jerusalem and were judged by God in the order of the Ten Commandments. Job\'s Empire Clock, the most comprehensive, traces all ten of those empires in order, demonstrating that God has been systematically judging humanity\'s great powers for thousands of years.', href:'empire-clocks.html'},
  {title:'Foundation: The Commandments', sub:'', synopsis:'This article establishes the Ten Commandments as the foundation of Lady Wisdom\'s House — the Law symbolized by lapis lazuli on which God\'s own throne rests and upon which Isaiah promised to rebuild Jerusalem. The commandments are shown to be embedded in the structures of Hannah\'s prayer, Paul\'s letters to Timothy, the Gospel of Matthew, Psalm 119, and Job\'s prophetic history of empires, making them the matrix for all of God\'s wisdom. The article takes a dual approach: displaying God\'s wrath channeled through the commandments in measured, deliberate historical judgments, and showing each commandment as a protective wall around a specific heavenly treasure that God wants his people to value. Together these perspectives transform the Law from a fearful threat into a glorious expression of divine love.', href:'foundation.html'},
  {title:'The Four Horsemen of the Apocalypse', sub:'', synopsis:'This article is a work in progress — a future exploration of the Four Horsemen of the Apocalypse from Revelation 6, examining their identities and the eras of history they represent. Check back for the completed article.', href:'four-horsemen.html'},
  {title:'Generational Clocks', sub:'', synopsis:'This article introduces five Generational Clocks — prophetic structures that measure time by human generations rather than years — and summarizes their history of discovery and the key insight that God counts people, not just celestial mechanics. The five clocks (Job\'s Anti-jubilee Clock, Job\'s Chapter Clock, the Shepherd\'s Clock of Psalm 119, the Cosmic Chiasm, and the Acrostic Clock of Psalms 111-112) each cover history from the creation or Abraham to Christ\'s return, with period lengths of 50, 119, or 120 years. Detailed tables of generation numbers, start and end years, Bible verse references, and prophetic interpretations are promised for each clock. The article narrates the intellectual journey of discovery that led from Matthew\'s genealogy to Job\'s clocks to the Psalms, revealing an unexpectedly rich prophetic system.', href:'generational-clocks.html'},
  {title:'Generations Come and Go', sub:'', synopsis:'Inspired by Ecclesiastes 1:4, this article narrates the author\'s discovery that human history has a forty-two generation structure mirroring God\'s dealings with mankind, drawn initially from Matthew\'s genealogy of Jesus. The article introduces autocorrelation — a signal-processing technique — as a mathematical analogy for detecting the characteristic frequency behind God\'s prophetic calendar. It establishes a Cosmic Chiasm — a mirror-symmetry between the earliest and latest eras of history — as the framework for understanding how God\'s plan unfolds from creation to Christ\'s return. The key insight is that God measures time by generations because people are more important to him than the mechanical motion of the stars.', href:'generations-come-and-go.html'},
  {title:'The Golden Rule', sub:'', synopsis:'The Golden Rule of Jesus (Matthew 7:12) is explored not as a simple ethical maxim but as a profound teaching requiring deep inner transformation before it can be genuinely practiced. Sandwiched between the ask-seek-knock passage and the narrow gate, it reveals that loving your neighbor as yourself demands changes to mind, heart, and hands — and that God himself must supply the resources needed to live it. The author traces his own decades-long journey of failure and growth, from trying and failing to follow Bonhoeffer\'s radical standard, to depression, pride, and wrong values, and eventually a discovery of how to live generously by relying on God\'s supply. The Golden Rule is not a beverage drunk once and forgotten but a spring returned to again and again, yielding new insight at every stage of life.', href:'golden-rule.html'},
  {title:'A Grand Father Clock & a Silver Cord', sub:'', synopsis:'A prophetic clock hidden in Ecclesiastes maps all of world history to three phases of human life: ascending years (4020 BC to 880 AD), productive years (880 to 2080 AD), and declining years (2080 to 2280 AD), followed by the end of history. Drawing on Solomon\'s tripartite structure of Ecclesiastes — twenty-eight lifetimes in chapters 1-10, productive-years material in chapters 10-11, and the fading-of-faculties imagery in chapter 12 — the author shows how major developments in Western Civilization fall into their correct centuries. The silver cord of Ecclesiastes 12:6, interpreted as the invisible thread tethering soul to body, becomes the symbol for history\'s end when it is finally severed. This Grand Father Clock is one of the most sweeping of all the prophetic clocks identified in the author\'s research.', href:'grandfather-clock.html'},
  {title:'The Growth Pattern of Solomon', sub:'', synopsis:'Solomon\'s Growth Pattern, drawn from the twenty-eight times of Ecclesiastes 3 organized into seven groups of four, is the author\'s most important discovery — the framework that unifies his understanding of discipleship, human development, and prophetic history. As a human developmental model, its seven phases span birth to full maturity, each with its characteristic challenge; as a discipleship model, Paul\'s first seven letters from Romans through Colossians match each phase in sequence; as a prophetic framework, it governs all of history at multiple scales simultaneously. The pattern explains why Solomon was the wisest man in history: he mapped out all the steps from birth to maturity without missing a single one. This article introduces the Growth Pattern and points to companion articles that explore its application to discipleship and to prophecy.', href:'growth-pattern.html'},
  {title:'Habakkuk: Part 1', sub:'', synopsis:'The Book of Habakkuk is mathematically structured in seven sections whose element counts form the seventh triangular number (1+2+3+4+5+6+7=28), proving that triangular numbers were intentionally woven into prophetic writing by Old Testament authors. The first section (Habakkuk 1:1-4) is a table of contents for the entire book, with each of its six questions answered in order by the six subsequent sections — a logical precision that rivals modern technical writing. The article analyzes each question and shows how it maps to its corresponding section, revealing Habakkuk as far more orderly and systematic than most readers have recognized. This structural insight is essential for understanding why 153, as the seventeenth triangular number, is connected to Habakkuk and to the miraculous catch of fish in John 21.', href:'habakkuk-part-1.html'},
  {title:'Habakkuk: Part 2', sub:'', synopsis:'Habakkuk 1:5-11 appears to describe one invading empire — the Chaldeans — but conceals five successive empires within a single prophecy: Babylon (bitter and proud), Persia (projecting justice and dignity), Greece (swift as leopards), Rome (the evening wolves), and Islam (the eagle from afar). The evening wolves capturing Jerusalem at the close of the fourth millennium precisely locates the arrival of Messiah, because Daniel promised the kingdom of God would be established during the fourth empire; the wolf at evening followed by a sunrise is Habakkuk\'s way of encoding the timing of Christ\'s birth. Each empire pioneered new means of rapid conquest, fulfilling the twin themes of bitterness and haste that the passage emphasizes seven times each. God answered Habakkuk\'s question about how long oppression would last by encoding the full sequence of oppressors in a single compressed oracle.', href:'habakkuk-part-2.html'},
  {title:'Habakkuk: Part 3', sub:'', synopsis:'Habakkuk 1:12-2:1 presents three interlocking trios of complaints about imperial cruelty, all centered on the imagery of nets, hooks, and dragnets used to catch and destroy nations as if they were helpless fish. The prophet turns the metaphor around, weaving a philosophical syllogism designed to catch God in his own logic: since God is eternal and unhurried, will He allow the wicked to empty their nets forever? A second layer of meaning is revealed: the choice between net and dragnet encodes the degree to which each of the five empires imposed cultural uniformity — monocultures like Babylon and Greece used nets of forced conformity, while more multicultural empires like Persia and Rome used dragnets of persuasion and accommodation. Jesus\' reversal in John 21 — turning killing nets into life-giving nets of evangelism — is the direct answer to Habakkuk\'s desperate plea.', href:'habakkuk-part-3.html'},
  {title:'Habakkuk: Part 4', sub:'', synopsis:'Habakkuk 2:2-5 is structured as three quartets building toward a single climactic statement — \'the righteous shall live by faith\' — which stands as the theological heart not only of Habakkuk but of all New Testament soteriology. God responds to the prophet\'s complaints with four instructions on how to communicate the vision, four assurances that it will be fulfilled, and four character portraits of the wicked (pride, treachery, greed, and oppression) — but slips in the fifth element of faith like a secret signal that the righteous will survive among these corrupting empires. The whole book forms a seven-part chiasm with this verse at its center, and that same verse sparked the Protestant Reformation when Martin Luther read it and grasped salvation by grace through faith alone. This article reveals how Paul, Luther, and Habakkuk all arrived at the same great truth hidden in the prophet\'s carefully layered answer.', href:'habakkuk-part-4.html'},
  {title:'Habakkuk: Part 5', sub:'', synopsis:'The five woes of Habakkuk 2:6-20 form a chiasm with the five civilizations identified in earlier sections, pronouncing specific divine sentences on each empire in reverse order — Ottoman Islam first, then Rome, Greece, Medo-Persia, and finally Babylon. Each woe matches the characteristic sin of its target civilization: the Ottomans were destroyed by their own debt and extravagant spending; Rome tried to build its nest in permanent security; Greece founded cities on bloodshed; Persia made neighbors drunk with wrath; and Babylon used sacred temple vessels to toast pagan idols. The prophet explicitly states that the words to follow are riddles, inviting the reader to decode the true targets behind the surface language. Connecting these woes to their fulfillments in history reveals Habakkuk as a precise prophetic document that anticipated the downfall of every major oppressor of Israel.', href:'habakkuk-part-5.html'},
  {title:'Habakkuk: Part 6', sub:'', synopsis:'Habakkuk 3:1-16 is the climax of the prophecy — a tightly structured war poem in which God\'s battle against oppressive empires is described through ten themes each repeated precisely six times, with the prophet\'s own sixfold physical response adding a seventh dimension. The ten themes — time, weapons, divine wrath, human fear, heaven and earth, water, glory, shaking, enemies, and the prophet\'s own trembling — each appear exactly six times, demonstrating intentionality that transcends poetic convention. The author tentatively identifies six passages as corresponding to six historical events: God approaching the field of battle, Persia defeating Babylon, Greece defeating Persia, Rome defeating Greece, Islam defeating Rome, and European powers defeating Islam. The final defeat of Leviathan — the ultimate beast — is acknowledged but left for a more definitive treatment in the companion article on Habakkuk\'s War.', href:'habakkuk-part-6.html'},
  {title:'Habakkuk: Part 7', sub:'', synopsis:'The final section of Habakkuk (3:17-19) lists six agricultural failures — no blossoms on the fig tree, no fruit on the vine, no olive harvest, no food from the fields, no flock in the fold, and no cattle in the stalls — each symbolizing an aspect of Israel\'s restoration that could not be fulfilled at Jesus\' first coming. Jesus directly addressed two of these at his resurrection: he provided a shepherd (commissioning Peter in John 21) and the bread of life; but the restoration of political Israel (the fig tree) and the Levitical priesthood (the vine) had to await the fullness of time. The three seventeenth verses of Habakkuk\'s three chapters capture three categories of victory: rescue of the innocent, judgment of the wicked, and provision of wise leadership. The prophet\'s final praise — \'I will rejoice in the Lord\' — offered in the face of total agricultural failure stands as one of the most remarkable acts of naked faith in all of Scripture.', href:'habakkuk-part-7.html'},
  {title:'Habakkuk\'s War', sub:'', synopsis:'This article returns to Habakkuk 3:1-16 with a data-clustering approach — mapping ten sixfold themes across sixteen verses — to uncover a six-battle sequence encoding the successive defeats of Babylon by Persia, Persia by Greece, Greece by Rome, Rome by Islam, Islam by European colonial powers, and finally all enemies by God at the last day. The key methodological insight is that ignoring the surface meaning of words and searching for the underlying mathematical structure first revealed a historical pattern that the words themselves had obscured. Each empire\'s defeat is encoded in imagery drawn from its own cultural history: the Persian veiling of power in the Book of Esther, the Greek measurement of the earth, Rome\'s chariots and the sea, Islamic bows and the moon, and the European marching through the earth in fury. This approach, which the author compares to a zero-knowledge proof in cryptography, validated the overall analytical method used throughout the Habakkuk series.', href:'habakkuk-s-war.html'},
  {title:'Hannah\'s Song', sub:'', synopsis:'Hannah, mother of the prophet Samuel, is identified as possibly the wisest woman in the Bible because her ten-verse prayer in 1 Samuel 2 encodes a complete prophetic framework that anticipates both Solomon\'s Growth Pattern and the existence of the seven pillars of wisdom — centuries before either was written. Her prayer\'s seven reversals of fortune precisely match the seven phases of the Growth Pattern, and her phrase \'the barren has borne seven\' names the number of pillars while \'the pillars of the earth are the Lord\'s\' names their essence. The article explores how Hannah\'s sacrifice — giving up her firstborn Samuel to serve God — connects to priestly ordination rituals and thereby to the question of women\'s roles in the church. Hannah\'s prophetic clock, embedded in her prayer, maps seven 480-year eras of history from the dedication of Solomon\'s temple, demonstrating that this overlooked prophetess was one of the most structurally profound voices in all of Scripture.', href:'hannah-s-song.html'},
  {title:'The Harvest Pattern of Jesus', sub:'', synopsis:'The Harvest Pattern, derived from Jesus\' parables of agricultural growth in Matthew, is a seven-phase framework for understanding how God brings barren souls into spiritual fruitfulness — introduced through the author\'s personal story of how it operated in his own life decades before he recognized it. The pattern\'s phases (plowing, planting, watering, pruning, harvesting, and more) can be traced backward through any spiritual breakthrough to reveal God\'s continuous care stretched across months and years. The article argues that memorizing and meditating on Scripture is more powerful than most Christians believe, tracing how the author\'s memorization of Galatians 2:20-21 led to deliverance from the fear of death and how Habakkuk 3:17-19 sustained him through depression to graduation from MIT. As the practical counterpart to the Growth Pattern, the Harvest Pattern governs not the normal course of life but the miraculous interventions by which God transforms barren souls into fruitful ones.', href:'harvest-pattern.html'},
  {title:'What are the Heavenly Treasures?', sub:'', synopsis:'Jesus commands his followers to lay up treasures in heaven but never lists what they are — this article fills that gap with a twelve-item inventory derived from decades of searching Scripture, starting with the Fear of the Lord and culminating in the Glory of God. The list is organized into a four-category framework — Being (eternal life), Establishing (family, work, authority), Nurturing (love, wisdom, courage), and Flourishing (freedom, happiness, joy) — each grounded in specific biblical texts. The article traces back to the author\'s memorization of the Sermon on the Mount in his early Christian life and the question it raised that launched over a decade of searching: if Jesus says to treasure things in heaven, what exactly are those things? The answer is not abstract but deeply practical, defining the goals that should orient every Christian\'s investment of time, energy, and devotion.', href:'heavenly-treasures.html'},
  {title:'Home', sub:'', synopsis:'This is the welcome page for the entire website, introducing Lady Wisdom\'s House as the organizing metaphor for a comprehensive biblical wisdom system built around three interlocking patterns: Solomon\'s Growth Pattern from Ecclesiastes, Jesus\' Harvest Pattern from Matthew, and Moses\' Law Pattern from Exodus. The site promises original research into seven core wisdom books — Psalms, Job, Proverbs, Song of Songs, Ecclesiastes, Matthew, and Revelation — through the lens of a new eschatological system called Fractal Historicism, which treats the Growth Pattern as the mainspring of all biblical prophecy. Beyond personal spiritual application, these patterns provide a prophetic map of history that enables readers to understand the timing of God\'s past and future judgments with unprecedented precision. The website constitutes a guided tour of Lady Wisdom\'s house, room by room, for anyone who wants to understand both how to grow to spiritual maturity and how God is guiding history toward its appointed end.', href:'home.html'},
  {title:'Identification', sub:'The Metaphor of Childbirth', synopsis:'This article — part of the women\'s ordination series — explores how the Seven Pillars of Wisdom connect to women\'s voices through figures like Lady Wisdom, Hannah, the Wife of Noble Character, and the Bride of Song of Songs, building a biblical case for women\'s full participation in church life. Hannah\'s prayer is decoded to show seven reversals of fortune matching the seven phases of the Growth Pattern, and her phrase \'the barren has borne seven\' is revealed as the earliest prophecy of the seven pillars themselves. The stability phase of the Growth Pattern (1 to 480 AD) is shown to coincide precisely with the historical period when women were progressively removed from church leadership roles — suggesting this was a biblically foretold season of confinement rather than the permanent divine intention. By grounding the discussion in the structural wisdom patterns of the Bible itself, the article argues that Scripture provides its own framework for understanding when and why restrictions on women\'s ministry were imposed and why they should be lifted.', href:'identification.html'},
  {title:'The Fifth Trumpet and the Industrial Revolution', sub:'', synopsis:'This wide-ranging article demonstrates that the Fifth Trumpet judgment of Revelation 9 — a 153-year plague of locusts from 1765 to 1918 AD — corresponds in precise detail to the Industrial Revolution and the era of Christian colonial empires led by queens, especially Britain\'s Queen Victoria. The locusts with women\'s hair, iron breastplates, lion\'s teeth, and scorpion-sting tails encode the queens\' gender, their empires\' Roman heritage, Britain\'s lion symbol, and the poison gas and machine guns of World War I. Beyond Revelation 9, the article catalogs over forty converging prophetic clocks from Ecclesiastes, Job, Matthew, the Psalms, and the Book of Revelation that all point to the same 1765-1918 era, including the Church of Philadelphia, Solomon\'s sundial, and the Parable of the Ten Virgins. The article amounts to a tour de force of convergent prophetic evidence for Fractal Historicism, treating the Industrial Revolution and its devastating wars as the fulfillment of God\'s judgment on both the world\'s pagan empires and Christendom itself.', href:'industrial-revolution.html'},
  {title:'Job: The Course of Empires', sub:'', synopsis:'This article reveals a thirteen-empire prophetic clock hidden in the Book of Job, surpassing in scope the five-empire clock of Habakkuk and the seven-empire clock of Revelation, by matching each speech in Job to a different world civilization and using the moral character of the speaker as a predictor of that era\'s moral tone. Dark speeches by Satan, Eliphaz, Bildad, and Zophar correspond to dark historical eras, while Job\'s own speeches and Elihu\'s correspond to better times — a speaker clock in which the dramatic texture of the book doubles as a chronological map of history. The article cross-references this Empire Clock with Job\'s Generational Clock (in which each chapter corresponds to a 119-year generation) to show that Job contains two independent yet overlapping prophetic systems. By including an anti-kingdom (the void) and God\'s eternal kingdom among its thirteen, Job provides the most complete structural blueprint for biblical prophecy about world history yet identified.', href:'job-course-of-empires.html'},
  {title:'Job Description for a Savior', sub:'', synopsis:'By asking what sustained Job\'s hope in each moment of despair, the author discovered nine sequential prophecies in Job\'s speeches that describe the life of Christ in chronological order — from his pre-incarnate glory to his birth, healing ministry, crucifixion, resurrection, and second coming — without Job knowing he was composing a divine job description. These nine requirements for a savior, scattered across Job\'s speeches as complaints and longings, are shown to have been fulfilled exclusively by Jesus of Nazareth, making the Book of Job an extended Messianic prophecy hidden beneath layers of suffering. Two obstacles block readers from seeing this: the intellectual labor of systematic biblical study and the emotional barrier erected by Job\'s suffering, which mirrors readers\' own unresolved pain and causes them to recoil from the text. Once both head and heart have been prepared by God\'s grace, the article argues, the prophetic system in Job becomes not only visible but inescapable.', href:'job-description-for-a-savior.html'},
  {title:'Job\'s Anti-Jubilee Clock, Defined', sub:'', synopsis:'This article presents a prophetic clock running from Abraham to Jesus hidden in the Book of Job, structured around the Year of Jubilee — the 50-year cycle of debt cancellation, slave release, and land restoration commanded in Leviticus 25. The clock is called anti-Jubilee because it traces the accumulation of oppression and injustice that made Christ\'s redemption necessary, running inverse to the cycles of liberation. The author introduces the discovery through his personal experience of a literal Jubilee year in 2022: his father\'s death freed the family from decades of debt, while a near-fatal fall through frozen pond ice — and his miraculous calm during twenty-five minutes in frigid water — demonstrated the life-preserving power of years spent studying biblical wisdom. Like other prophetic clocks, this one contains a built-in riddle that specifies the length of each period, proving systematic intentionality in Job\'s text and validating the broader methodology of the website.', href:'job-s-anti-jubilee-clock-defined.html'},
  {title:'Lady Wisdom\'s House', sub:'', synopsis:'This article explores the recurring biblical metaphor of building a house — from Solomon\'s temple to Jesus\' parable of the wise and foolish builders — and argues that these uses are connected to a single overarching concept: Lady Wisdom\'s House, the organizing framework for all biblical wisdom. Just as the labeled tabs of a paper model must be inserted into matching slots to produce the final structure, the riddles scattered through the wisdom books (like the Seven Spirits of God and the Voices of the Seven Thunders) are structural connectors that link seemingly disparate passages into one coherent edifice. Understanding the architecture of this house, the author argues, transforms scattered biblical teachings into a unified system with practical implications for spiritual growth, church history, and eschatology. The article surveys several such connective riddles and shows how each, once decoded, opens up a new room in Lady Wisdom\'s house.', href:'lady-wisdom-s-house.html'},
  {title:'Lady Wisdom', sub:'', synopsis:'This article introduces Lady Wisdom — the personified Wisdom of Proverbs — as a living, knowable figure whose four appearances in Proverbs (chapters 1, 3, 8, and 9) reveal a progressively deepening relationship, from public street preacher to intimate dinner hostess. The author approaches her the way one approaches a favorite author: through her books, then her biography, then a pilgrimage to her house — and confesses that it took decades of study before the depth of her wisdom became apparent. Her résumé in Proverbs 8, where she claims to have been present at the creation of the world and to have been the master craftsman at God\'s side, is explored as the strongest biblical evidence for her identity as either the pre-incarnate Christ or the Holy Spirit. The article is a personal and scholarly invitation to begin the lifelong journey of getting to know Lady Wisdom, whose house the entire website is devoted to exploring.', href:'lady-wisdom.html'},
  {title:'The Law Pattern of Moses', sub:'', synopsis:'The Law Pattern of Moses — encoded in the Ten Commandments — is revealed as the true foundation of Lady Wisdom\'s House and the matrix into which both the Growth Pattern of Solomon and the Harvest Pattern of Jesus perfectly fit. The first tablet of commandments, governing love of God, matches the Harvest Pattern point for point; the second tablet, governing love of neighbor, matches the Growth Pattern — confirming that the commandments together bridge eternity and time, spirit and matter. The Ten Commandments function as a structural template throughout the Bible, sometimes organizing material into ten parts and sometimes into fourteen (when each commandment is parsed into its component imperative statements), as seen in Hannah\'s prayer, the letters of 1 and 2 Timothy, and the entire Gospel of Matthew. This article introduces the two sub-articles that work out the implications of the Law Pattern in detail: Which Ten Commandments? and Matthew and the Law of Christ.', href:'law-pattern.html'},
  {title:'Lifespan of Solomon', sub:'', synopsis:'This article tackles the chronological puzzle of determining Solomon\'s birth year — information not directly stated in Scripture but necessary to solve a riddle embedded in Ecclesiastes about a man who lives \'a thousand years twice over.\' Drawing on the genealogical analysis of Pastor D. Thornton and supplementing it with reasoning from 2 Samuel and 1 Chronicles, the author arrives at a best estimate of sixty-three years for Solomon\'s lifespan. The riddle-solving method — identifying a number embedded in poetic text, then using known historical anchors (the temple dedication in 960 BC) to calculate its prophetic implications — is a microcosm of the broader methodology used throughout the website. Without knowing Solomon\'s age, the prophetic calendar hidden in Ecclesiastes cannot be unlocked, making this chronological detective work a necessary foundation for the entire system of Fractal Historicism.', href:'lifespan-of-solomon.html'},
  {title:'Matthew and the Law of Christ', sub:'', synopsis:'The Gospel of Matthew is shown to be structured according to the fourteen imperative statements of the Ten Commandments, with each pair of chapters providing commentary on one commandment as reinterpreted by Jesus under the new covenant — making concrete what Paul called \'the Law of Christ.\' The discovery was made when the author noticed that the center chapters of Matthew call Jesus the Lord of the Sabbath and discuss the fifth commandment, landing precisely at the center of the fourteen imperatives. The structure functions as a decoder ring for Pauline theology about law and grace: the Law of Christ is not a vague rhetorical concept but a specific content visible in Matthew\'s architecture. Together with its conformity to the Growth Pattern and the Harvest Pattern, this Law Pattern conformity makes Matthew the most structurally complex and prophetically rich book in the New Testament.', href:'matthew-and-the-law-of-christ.html'},
  {title:'What are Life\'s Twelve Most Important Questions?', sub:'', synopsis:'This article identifies twelve meta-questions whose answers, when discovered, transform the seeker — questions that God uses to guide people forward rather than simply handing them answers. The twelve questions are self-authenticating: only after finding an answer that changed you, opened your eyes, or set you free do you recognize it was the right question to ask. The author traces his own journey from memorizing the Sermon on the Mount and discovering the Golden Rule, to a decade-long search for heavenly treasures, to further questions about spiritual resilience and the path to peace — each question arising out of the unresolved residue left by the previous answer. The twelve questions serve as an organizing framework for the entire website, helping visitors identify which articles speak most directly to their own season of seeking.', href:'most-important-questions.html'},
  {title:'Numerology', sub:'', synopsis:'This article defends the use of numbers in biblical interpretation against modern scholarly skepticism, arguing that the Bible contains a structured numerological vocabulary that careful study can decode without falling into the speculative errors of the past. The author distinguishes seven sources of biblical numbers — explicit counts, collection sizes, word frequencies, math puzzles, structural elements, numerical sequences, and gematria — and proposes a WHERE CLAUSE principle: numbers must always be confirmed by independent textual correspondences before being used to support an interpretation. Evidence is presented that the chapter and verse divisions of Job, 1 and 2 Timothy, Matthew, and the Psalms were not arbitrary but were divinely guided to communicate prophetic information. The article concludes by noting that careful numerical analysis may be the only key capable of unlocking three of the Bible\'s greatest unsolved mysteries, including the secret message of the Seven Thunders in Revelation 10.', href:'numerology.html'},
  {title:'The Apostle Paul\'s Discipleship Program', sub:'', synopsis:'Paul\'s first seven letters — Romans, 1 and 2 Corinthians, Galatians, Ephesians, Philippians, and Colossians — are revealed to form a complete discipleship curriculum when read in canonical order, with each letter addressing one of Solomon\'s seven phases of spiritual growth in sequence. The discovery came to the author while lying sick on a couch: without Bible or notepad, the structural correspondence suddenly became clear — Paul\'s letters follow exactly the course syllabus that Solomon laid out in the twenty-eight times of Ecclesiastes 3. Because Solomon\'s Growth Pattern is complete (he missed no phases), and because Paul\'s letters match every phase, Paul\'s program for sanctification is equally complete and fully sufficient for bringing any believer from new-convert insecurity to mature, battle-tested faithfulness. The article introduces each letter and its corresponding growth phase, providing a practical road map for the whole journey of Christian discipleship.', href:'pauls-discipleship-program.html'},
  {title:'Peace, like Solomon Never Knew', sub:'', synopsis:'This page describes and provides the table of contents for the author\'s first major theological book, *Peace, like Solomon Never Knew*, which is the primary source for much of the material on this website. The book\'s central discovery is the Growth Pattern of Solomon, extracted from the twenty-eight times of Ecclesiastes 3 and shown to govern both the stages of individual human life and the flow of all history as a prophetic clock. A maze based on Solomon\'s twenty-eight times appears as a playful introduction, reflecting the book\'s thesis that wisdom is found by following a prescribed path through life\'s seasons. Readers who want the detailed scholarly argument behind the website\'s prophetic and discipleship frameworks will find it here, across chapters covering Ecclesiastes, the Psalms, Job, Daniel, Matthew, and Revelation.', href:'peace-book.html'},
  {title:'Plague, Precept, Prophet, Peace', sub:'', synopsis:'This page describes and provides the table of contents for the author\'s second major theological book, *Plague, Precept, Prophet, Peace*, which expands the prophetic framework of the first by adding Moses\' Law Pattern as the foundation beneath the Growth and Harvest Patterns. The book traces the structural correspondence of the Ten Commandments throughout the Bible — in the Psalms, Job, Matthew, Timothy, and Exodus — and shows how the plagues of Egypt and the commandments together form a matrix into which all of God\'s historical judgments can be mapped. A key discovery is Job\'s Anti-Jubilee Clock, a prophetic timeline running from Abraham to Jesus hidden in the Book of Job. The preface reveals that the book was delayed a year because God gave the author a personal Jubilee — including a near-fatal fall through ice — that provided the experiential key needed to unlock the text\'s teaching about the Year of Jubilee.', href:'plague-book.html'},
  {title:'Prophetic Clocks', sub:'', synopsis:'This article introduces the concept of a prophetic clock — a regular, systematic, chronological arrangement of prophecies in the Bible that covers all of history from beginning to end — and explains why God would encode such a clock in riddles rather than in plain language. Drawing on Amos 3:7 (\'the Lord does nothing without revealing his secret to the prophets\'), the author argues that since the biblical canon is closed, it must already contain detailed prophecies of everything God has done and will do; the challenge is to decode them. The ideal prophetic clock would be regular as a timepiece, chronological, and progressing in even intervals — and the author argues that Solomon\'s Growth Pattern meets all these criteria when applied at the scale of world history. The article establishes the philosophical and hermeneutical foundation for all the specific prophetic clocks explored throughout the website.', href:'prophetic-clocks.html'},
  {title:'Proverbs 1 to 3', sub:'', synopsis:'The first three chapters of Proverbs are shown to correspond to the first three millennia of history (4020-1020 BC), each chapter matching one member of the Trinity and one season of the year — a retrospective prelude before the twenty-eight forward-looking chapters that follow. Beginning with chapter 4, the remaining chapters of Proverbs follow Solomon\'s Growth Pattern, each covering 120 years of history from the dedication of the temple in 960 BC, making Proverbs a prophetic timeline preserved through Hezekiah\'s careful editorial work. This structure transforms Proverbs from a loose anthology of wisdom sayings into a sweeping prophetic narrative about the long summer of human history, building toward a final harvest. The introductory chapters reveal a failed harvest in Eden followed by three millennia of preparation — Autumn (Creation to Noah), Winter (Noah to Abraham), and Spring (Abraham to Solomon) — before the Summer of the age of the temple begins.', href:'proverbs-1-to-3.html'},
  {title:'Proverbs 20 to 29', sub:'', synopsis:'Proverbs chapters 20 through 29 are analyzed as a section of the prophetic clock running through the book, with each chapter matching one of Solomon\'s twenty-eight times and covering a 120-year era of history from roughly 960 AD to 2160 AD. Each chapter\'s wisdom sayings illuminate the characteristic challenge of its corresponding life phase and historical period — from searching (chapter 20, covering 960-1080 AD, the age of the First Crusade) to the coming era of war (chapters 28-29). The prophetic connections are grounded in the text itself: specific proverbs about kings, enemies, and divine judgment are matched to events in their corresponding centuries, demonstrating that the sayings were deliberately arranged to tell history in code. This section of Proverbs is a testament to the extraordinary prophetic and editorial work accomplished by Hezekiah\'s scholarly team.', href:'proverbs-20-to-29.html'},

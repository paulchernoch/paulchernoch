  {title:'Proverbs 30 to 31', sub:'', synopsis:'The final two chapters of Proverbs are revealed as prophecies of the last two eras of history: chapter 30 (authored by Agur) covers a time of war (2160-2280 AD) and chapter 31 (attributed to Lemuel\'s mother) describes the age of peace that follows. Proverbs 31, the portrait of the Wife of Noble Character, is read as a prophecy of the church at last fully mature — a community that also announces the complete liberation and enfranchisement of women, who will finally be respected and productive in every sphere. Strikingly, only the good times from Solomon\'s twenty-eight times appear in chapter 31, suggesting that the end of history will be characterized by flourishing for those who remain faithful. The article concludes with a moving personal note about the author\'s father, who died the week this chapter was being written, and whose lifelong insistence on wisdom set his son on the path that led to all these discoveries.', href:'proverbs-30-to-31.html'},
  {title:'Proverbs 4 to 19', sub:'', synopsis:'Proverbs chapters 4 through 19 are shown to constitute a prophetic clock in which each chapter corresponds to one of Solomon\'s twenty-eight times and to a 120-year era of history beginning in 960 BC — demonstrating that Proverbs is simultaneously practical wisdom for individuals and a prophetic timeline for civilizations. The article methodically matches each chapter\'s thematic content to its life phase (chapter 4 matching the time of being born, chapter 5 the time of dying, and so on through chapter 19) and to specific historical events in the corresponding era. The fulfilled prophecies demonstrate that God structures history by the same principles he uses to structure human lives, turning the history books into a training manual for wise living. This section constitutes one of the most thoroughgoing demonstrations of the Growth Pattern\'s prophetic accuracy across all twenty-eight phases, and supports the broader argument that Proverbs was carefully arranged — not haphazardly assembled — by editors who understood the wisdom pattern.', href:'proverbs-4-to-19.html'},
  {title:'Psalm 102', sub:'', synopsis:'Psalm 102, identified as written by King Hezekiah, is decoded as a prophetic clock structured according to Solomon\'s twenty-eight times, covering the same historical span as Solomon\'s Celestial Clock but with special prophetic focus on Islamic conquests of the Holy Land and their aftermath. The psalm\'s twenty-eight verses, extensive time-language, and use of themes from Ecclesiastes reflect Hezekiah\'s deep study of Solomon — the same king whose proverbs Hezekiah\'s team preserved. Hezekiah\'s personal experience of near-fatal illness and divine healing (receiving fifteen extra years of life) becomes a parable for Israel, which also appeared to be dying but received a reprieve. The mathematical key unlocking the connection is 816 = 8 x 102, the span in years from the Muslim capture of Jerusalem (637 AD) to the Fall of Constantinople (1453 AD), pointing the interpreter to this psalm as the prophetic text governing that era.', href:'psalm-102.html'},
  {title:'Psalm 107: Where is the Love?', sub:'', synopsis:'Psalm 107 is revealed as a richly structured prophetic document organized in seven sections, each following a four-part rhythm of trouble, cry, rescue, and praise, mapping the history of the church from the Roman era to the end of the age. The psalm\'s central image of God gathering his scattered people from the four directions becomes a prophecy both of Israel\'s physical return to its land and of the gospel\'s expansion to every corner of the earth, with each of the seven sections matched to a specific historical era of Christian mission and expansion. The familiar refrain — \'Let them give thanks to the Lord for his unfailing love and his wonderful deeds for mankind\' — repeated four times, structures the psalm around the number four (the four cardinal directions) while the Harvest Pattern governs the whole. The article argues that Psalm 107 is God\'s direct answer to the prayer at the close of Psalm 106 for the restoration of the exiles, making the two psalms a prophetic call-and-response spanning from the Babylonian exile to the Second Coming.', href:'psalm-107.html'},
  {title:'Psalm 119: The Shepherd\'s Clock', sub:'', synopsis:'Psalm 119, the Bible\'s longest chapter, is decoded as a prophetic clock in which each of its twenty-two Hebrew-alphabet stanzas corresponds to a 119-year generation of history, beginning with King David and extending to the present and beyond. The number 119 is shown to derive from 7 (completeness) multiplied by 17 (victory), encoded in the Genesis 8:4 reference to the ark resting on the seventeenth day of the seventh month — God\'s complete victory over evil at the flood. David\'s authorship is established by eight independent lines of evidence including linguistic patterns, royal themes, and parallels with confirmed Davidic psalms. The psalm\'s final verse — \'I have strayed like a lost sheep; seek your servant\' — connects to the Good Shepherd imagery running from Ecclesiastes through Jesus\' parables, framing all 176 verses as humanity\'s long cry to be found by the Shepherd of history.', href:'psalm-119.html'},
  {title:'Quantification', sub:'When did the Ordination Occur?', synopsis:'This article, part of the women\'s ordination series, applies Solomon\'s prophetic clock to determine precisely when God\'s plan for the liberation of women was scheduled to begin — and demonstrates that the scheduled time is already well in our past. Using the Growth Pattern\'s seven 480-year phases from the dedication of Solomon\'s temple in 960 BC, the author maps the time to be silent (680-1800 AD) and the time to speak (1800-1920 AD) to specific centuries, showing that the prophesied era of women\'s public ministry and ordination was inaugurated two hundred years ago. The Motherhood Pattern — a variant of the Growth Pattern specific to women\'s life phases, including conception, confinement, birth, and recovery — provides the biological and theological rationale for why women were temporarily restricted from leadership roles during the church\'s adolescent period. The conclusion is that Paul\'s instructions about women\'s silence were for a specific prophetic season, not a permanent divine decree, and that season has been over since the Great Awakening and the rise of women missionaries.', href:'quantification.html'},
  {title:'Reconciliation', sub:'The Childbearing in 1 Timothy 2', synopsis:'This article, the culminating entry in the women\'s ordination series, provides both a spiritual sign and a literal sign to confirm that God\'s ordained season of women\'s liberation has arrived. The spiritual sign is the Protestant Reformation — interpreted as the Childbearing of 1 Timothy 2:15, giving birth to a new civilization — and the literal sign is the development of safe blood transfusions and the first antibiotic in 1928, which ended the era when childbirth itself was routinely fatal for women. Five consecutive times from Solomon\'s Growth Pattern (tear, mend, silent, speak, love) are matched to five historical eras from the Reformation to the present, each corresponding to a specific advance in women\'s liberation from the birth of Protestantism to the winning of the vote. The cumulative argument is that Scripture, history, and medicine all converge on the same verdict: the long season of women\'s subordination in the church has ended, and the time to love — marked by the equality of women in most spheres of life — has already begun.', href:'reconciliation.html'},
  {title:'A Riddle of 153 Fish', sub:'John 21', synopsis:'John 21\'s account of the disciples catching exactly 153 large fish has puzzled Christians for nearly two thousand years — this article introduces the riddle and points to the broader investigation that unravels its meaning. The scene is rich with symbolism: the disciples catching nothing all night until Jesus appears at sunrise, the net that holds 153 fish without tearing, and the charcoal breakfast Jesus prepares on the shore. To find the answer, readers are directed to the numerology section of the site where connections between 153, Noah\'s Flood, the prophet Habakkuk, and the trumpets of Revelation converge into a single answer. The article serves as a gateway into one of the most surprising and mathematically elegant discoveries in all of the author\'s biblical research.', href:'riddle-of-153-fish.html'},
  {title:'Riddles of War', sub:'', synopsis:'Proverbs 30, positioned as the penultimate chapter of the book and corresponding to the time of war (2160-2280 AD) in Solomon\'s Growth Pattern, is decoded as God\'s battle plan for the final conflict between good and evil hidden in plain sight. The chapter\'s distinctive literary form — counting similar things and then listing them — provides the structural key: thirteen numbered sayings about ants, coneys, locusts, lizards, and other creatures encode military tactics and the moral forces at play in history\'s final war. The chapter\'s explicit self-identification as an oracle and its admission that the writer lacks wisdom (Proverbs 30:3) bracket the material as a riddle deliberately composed beyond normal comprehension. The article deciphers this riddle by cross-referencing it with Revelation and other prophetic texts, revealing a vision of God\'s decisive intervention on behalf of the righteous against Leviathan and the final beast.', href:'riddles-of-war.html'},
  {title:'Riddles', sub:'', synopsis:'This article introduces a special category of biblical puzzle called Emotional Riddles — passages deliberately worded to provoke anger, despair, confusion, or shame in the reader, thereby concealing their deepest wisdom from the hostile or impatient heart. God designs some riddles this way because only those who persevere through the emotional barrier (who press through fear, humiliation, or offense) will discover the treasure on the other side — a technique that mirrors the biblical principle that the glory of kings is to search out what God has concealed. Three examples are explored: the Fear of the Lord (which sounds terrifying to abuse survivors), the proverb about not being overly righteous (which seems to endorse mediocrity), and Samson\'s honey riddle (whose solution cost his first wife her life). The article argues that emotional resilience, more than intellectual ability, is the key that unlocks the Bible\'s deepest treasures.', href:'riddles.html'},
  {title:'The Roof: Paul\'s Gospel of Peace', sub:'', synopsis:'This article explains how Paul\'s seven letters form the roof of Lady Wisdom\'s House — the capstone of the entire biblical wisdom structure — by providing the fullest account of how peace with God, self, and neighbor is achieved through Christ. The author traces his personal journey through four books: identifying heavenly treasures (The Endless Hunt), confronting loss and mourning (Job Rises), mapping the path to peace through Solomon (Peace, like Solomon Never Knew), and exploring God\'s justice and peace through the Law and Psalms (Plague, Precept, Prophet, Peace). The roof of peace fits atop the seven pillars because both the Harvest Pattern (ending in peace) and the Growth Pattern (ending in loyalty that produces peace) point skyward toward the same destination. Paul\'s seven letters from Romans to Colossians function as the architect\'s final design: each letter addresses one growth phase, building the believer from eternal security in Romans to complete loyalty in Colossians.', href:'roof-of-peace.html'},
  {title:'The Salvation Pattern', sub:'', synopsis:'This article presents a landmark discovery: twelve separate passages in the Bible each enumerate the complete Order of Salvation in the same sequence, resolving a centuries-old theological debate about the Ordo Salutis. The passages range from the Ten Commandments (Exodus 20) to Job\'s nine speeches, Elihu\'s speech, God\'s speech to Job, Psalm 19, Proverbs 1-9, the Beatitudes, the full Sermon on the Mount, John 17, Paul\'s letters to churches, and Ephesians 4 — all presenting nine to twelve steps from Calling through Glorification in essentially the same order. The discovery strongly corroborates the Reformed Order of Salvation, with the main differences being the optional inclusion of Election and Predestination at the beginning and a swap between Salvation and Adoption. The article maps the salvation process into three phases (Seeker, Believer as servant, Son in full inheritance), making visible the complete arc of God\'s saving work in a single person\'s life.', href:'salvation.html'},
  {title:'Satan\'s Taunt', sub:'Psalm 91', synopsis:'This article solves the riddle of why Satan chose to quote Psalm 91 when tempting Jesus in the desert — and finds the answer laced with irony, because Psalm 91 is the very psalm that prophesies Satan\'s binding and defeat. Psalm 91 is the thirteenth triangular psalm (91 = 1+2+...+13) and its thirteenth verse — \'You will tread on the lion and the cobra; you will trample the great lion and the serpent\' — is the key to understanding what the devil was inadvertently confessing by quoting it. The article situates Psalm 91 within the broader context of the author\'s discovery that triangular-numbered psalms carry special prophetic significance, a pattern that also links Habakkuk (structured around the seventh triangular number, 28) to the miraculous catch of 153 fish (the seventeenth triangular number). Satan\'s selective quotation of the psalm was intended to trap Jesus but instead announced the very sentence that would fall on Satan when Christ completed his mission.', href:'satan-s-taunt.html'},
  {title:'Shhh! Secret!', sub:'', synopsis:'This page collects the website\'s most intriguing biblical riddles into a single spoiler-protected gallery, inviting visitors to guess the answer before revealing it with a click — a playful entry point into deeper articles. Riddles covered include: the meaning of the number 42 (the gematria of God\'s name Eloah, and the answer to the meaning of life), the identity of the wisest woman in the Bible (Hannah), why the disciples caught 153 fish, when Satan was bound (already, in 380 AD) and unbound (a thousand years later), what the Seven Pillars of Wisdom are (seven specific Bible books), and whether the sealed message of the Seven Thunders in Revelation 10 can be decoded (yes, because they spoke before in Exodus, Job, and the Psalms). Each riddle links to the full article where the answer is developed with detailed textual analysis and historical evidence. The page is designed to spark curiosity and draw in readers who might not know where to begin in such a large library of material.', href:'secret.html'},
  {title:'Seven Cycles of Judgment', sub:'', synopsis:'This article maps the seven bowl judgments of Revelation 16 to the Seven Spirits of God from Isaiah 11:2, showing that each spirit instigates a different category of divine judgment against the world in the sequence given by Isaiah. The Seven Spirits — the Spirit of the Lord, Wisdom, Understanding, Counsel, Might, Knowledge, and the Fear of the Lord — are each matched to one of the seven pillar books, one phase of the Harvest Pattern, and one divine judgment, all in the same canonical order. The analysis reveals a surprising unity between the structure of Lady Wisdom\'s House (built by the seven spirits) and the structure of the world\'s destruction (dismantled by the same seven spirits in their last great outpouring). The article ends by observing how the final earthquake of the seventh bowl flattens every house not built on the rock of God\'s law — a direct echo of Jesus\' parable at the close of the Sermon on the Mount.', href:'seven-cycles-of-judgment.html'},
  {title:'The Seven Pillars of Wisdom', sub:'', synopsis:'This article tells the story of how the author discovered the Seven Pillars of Wisdom — the seven Bible books Psalms, Job, Proverbs, Song of Songs, Ecclesiastes, Matthew, and Revelation — not by searching for them deliberately, but by following the Holy Spirit\'s guidance through decades of immersion, suffering, and mystical experience. The discovery came only after each pillar had been buried deep through painful longing, fed by imagination through poetry and fiction, and studied with exactitude — the Spirit\'s way of preparing the scholar before unveiling the whole. The seven books are unified by a set of connections that no other books share: all conform to both the Harvest Pattern and the Growth Pattern, and all are ordered according to the Harvest Pattern\'s sequence. The article describes the practical message of each pillar — what wisdom each book is designed to produce in the believer — and invites readers to begin their own journey through the house whose foundation is the Law and whose roof is peace.', href:'seven-pillars-of-wisdom.html'},
  {title:'What are the Seven Pillars of Wisdom?', sub:'', synopsis:'This article answers the ancient riddle of Proverbs 9:1 — \'Wisdom has built her house; she has hewn her seven pillars\' — by identifying the seven pillars as seven specific Bible books: Psalms, Job, Proverbs, Song of Songs, Ecclesiastes, Matthew, and Revelation. What distinguishes these seven from all other Scripture is that they uniquely conform to both the Harvest Pattern of Jesus and the Growth Pattern of Solomon, making them the structural pillars of a comprehensive wisdom system. The article describes the practical wisdom that each pillar book is designed to impart — from Psalms teaching reverence and security in God, to Job teaching endurance through suffering, to Revelation teaching the Fear of the Lord that completes wisdom. The first prophet to announce the existence of these seven pillars was Hannah, whose prayer in 1 Samuel 2 contains the phrase \'the barren has borne seven\' paired with \'the pillars of the earth are the Lord\'s\' — both references pointing to this same set of books.', href:'seven-pillars-riddle.html'},
  {title:'Lanterns: The Seven Spirits of God', sub:'', synopsis:'The Seven Spirits of God in Revelation — identified with the seven spiritual qualities listed in Isaiah 11:2 — are matched to the seven pillar books of the Bible and the seven phases of the Harvest Pattern, revealing a coherent theology of how the Holy Spirit works through Scripture to transform believers. Each spirit illuminates one pillar book like a torch mounted on a pillar: the Spirit of the Lord illuminates Psalms, Wisdom illuminates Job, Understanding illuminates Proverbs, Counsel illuminates Song of Songs, Might illuminates Ecclesiastes, Knowledge illuminates Matthew, and the Fear of the Lord illuminates Revelation. The article traces four major historical sendings of the Seven Spirits into the earth, showing that God deploys them in the canonical order of Isaiah 11 and that each sending corresponds to a new era of spiritual awakening in church history. The beauty of this ordering is that the pillar books were arranged in this same sequence by Jesus\' Harvest Pattern before the spirits were matched to them — providing independent confirmation that the selection and ordering of the pillars is correct.', href:'seven-spirits.html'},
  {title:'Voice of the Seven Thunders', sub:'', synopsis:'This article tackles one of the Bible\'s most enigmatic puzzles: the Seven Thunders of Revelation 10, whose message John was told to seal up and not write down. The author\'s discovery is that the Seven Thunders have spoken before — in the seven thunder Psalms (18, 29, 68, 77, 81, 93, and 104), in the seven plagues of thunder in Exodus, and in Job — and that their repeated message can be assembled from these prior appearances even though John\'s specific vision remains sealed. The seven prior thunderings, each associated with one of the Seven Spirits and one phase of the Harvest Pattern, collectively describe a song that will be sung at the final victory: a song of glory, salvation, worship, miracle, praise, gospel proclamation, and resolution. The article argues that God did not forbid knowledge of the thunders\' content but rather transferred the revelation to earlier texts that were left unsealed — a pattern consistent with his practice of giving the same revelation to multiple prophets across the centuries.', href:'seven-thunders.html'},
  {title:'The Sojourn of Israel', sub:'', synopsis:'This article works out the chronology of Israel\'s sojourn in Egypt — determining when it began, when the 400 years of affliction started, and when the 430 years of total residence ended — as a necessary foundation for solving the riddle of Job\'s Anti-Jubilee Clock. The analysis treats the Bible like a Sudoku puzzle: many date-cells have been erased, but by assembling all the biblical constraints (elapsed times, genealogical counts, and cross-references), the missing dates can be recovered. The article carefully distinguishes between the total 430 years of sojourning (counting from Abraham\'s departure from Haran) and the 400 years of affliction (counting from when Ishmael mocked the newly weaned Isaac), harmonizing otherwise conflicting texts in Genesis, Exodus, and Galatians. The conclusion places the sojourn from 1877 BC to 1447 BC, which anchors the subsequent calculation of the Anti-Jubilee Clock hidden in Job.', href:'sojourn-of-israel.html'},
  {title:'Solomon\'s Countdown Timer', sub:'', synopsis:'Solomon\'s twenty-eight times in Ecclesiastes 3 are revealed to be not only a map of human life but also a countdown clock for world history, with each time corresponding to a 120-year era from 960 BC to approximately 2280 AD, when the age of peace is expected to arrive. The article presents a detailed table matching each of the twenty-eight times to specific historical events — from Israel\'s civil war at the time of being born (960 BC) to the expected return of Christ at the time for peace (2280 AD) — demonstrating the pattern\'s prophetic accuracy across thirty-three centuries. The mathematical beauty of the number twenty-eight (simultaneously a triangular and perfect number matching the sidereal month) is shown to be intentional: Habakkuk used 28 as the seventh triangular number to structure his prophecy, and Solomon used the same number as the mainspring of history\'s clock. This countdown timer is the master framework for all of the prophetic clocks explored on the website.', href:'solomon-s-countdown-timer.html'},
  {title:'Spiritual Growth', sub:'', synopsis:'This section introduction surveys the full range of spiritual growth articles on the website, introducing five patterns that govern how Christians develop from infancy to full maturity: the Harvest Pattern (Jesus), the Growth Pattern (Solomon), the Motherhood Pattern (Job and 1 Samuel), the Law Pattern (Moses), and the Journey Pattern (Matthew and Job). The author explains why Jesus used agricultural analogies for spiritual growth: because the same principles that govern the growth of plants from seed to harvest also govern the growth of individuals, churches, nations, and civilizations — making prophecy possible and history interpretable. A key argument is that Solomon\'s statement that \'no progression of thought from one section to another is discernible\' in Ecclesiastes (quoted from a scholarly commentary) is wrong: the twenty-eight times are perfectly ordered to describe human development from birth to maturity. This introduction frames all the articles in the Spiritual Growth section as tools for understanding and cooperating with God\'s design for the seasons of a human life.', href:'spiritual-growth.html'},
  {title:'Spiritual Warfare', sub:'', synopsis:'This comprehensive article on spiritual warfare begins by arguing that the most important preparation for battle is to understand spiritual growth — because the enemy\'s goal is to stop that growth, and understanding what he is attacking is the first step to defending it. The Great Commandment (love God with all your heart, soul, mind, and strength; love your neighbor as yourself) provides the framework: spiritual warfare is ultimately the defense of the capacity to love, which the enemy attacks on five battlefields (heart, soul, mind, strength, and community). The article then marshals the full toolkit of Lady Wisdom\'s House — the Harvest Pattern, the Growth Pattern, the Seven Spirits, the Seven Pillars, the Law of Christ, and the Whole Armor of God — as integrated resources for both understanding and winning the spiritual battle. Practical guidance is grounded in the author\'s personal experience with nightmares, depression, anxiety, and temptation, offering hard-won wisdom for believers under siege.', href:'spiritual-warfare.html'},
  {title:'Submission', sub:'The Sacrifice of Long-suffering Christian Women', synopsis:'This article, the third in the women\'s ordination series, argues that the long suffering of Christian women across the centuries — like that of the author\'s church member Janet Sullivan, whose rheumatoid arthritis could not diminish her spiritual radiance — constitutes a collective ordination sacrifice that qualifies women for full church ministry. The mysterious verse of 1 Timothy 2:15 — \'she will be saved through The Childbearing, if they continue in faith and love and holiness\' — is interpreted not as individual women being saved by bearing children, but as a group of women (the church) being saved through a special Childbearing event, which the author identifies with the Protestant Reformation. The emphasis on faith, love, holiness, and sound-mindedness as the conditions points to a sacrificial ordination, not biological reproduction. The article ends with the question of what exactly The Childbearing is, setting up the following articles in the series to answer it through the framework of prophetic clocks.', href:'submission.html'},
  {title:'Job and the Ways to Talk to God', sub:'', synopsis:'This article catalogs nearly every permissible means of human communication with God — and God\'s communication back to humans — as found hidden throughout the Book of Job, arguing that Job\'s comprehensive treatment of this subject makes it the Bible\'s definitive 911 call center. The means are divided into three eras: those available before Jesus\' birth (dreams, visions, angels, nature, wise elders, lots, prayer), those available during Jesus\' earthly ministry, and those given to the church at Pentecost (the Holy Spirit, tongues, prophecy, healing). The discovery was motivated by the author\'s experience of finding a rainbow at the end of an exhausting day of family crises — God\'s wordless communication that He is present and eager to talk. The article closes with a practical exhortation: employ the ordinary means of communication consistently, pray for the extraordinary ones, and trust that God will speak in the way best suited to your need.', href:'talk-to-god.html'},
  {title:'The Beatitudes and the Order of Salvation', sub:'', synopsis:'The Beatitudes of Matthew 5 are revealed to be far more than scattered blessings for different personality types — they are Jesus\' precise, nine-step answer to King David\'s prayer for salvation in Psalm 19, arranged in the same order as the Reformed Ordo Salutis (Order of Salvation) and conforming to the Harvest Pattern. Each beatitude corresponds to one step of salvation: from Calling (poor in spirit) through Regeneration (mourning), Faith (meekness), Repentance (hunger and thirst for righteousness), Justification (mercy), Sanctification (pure in heart), Adoption (peacemakers), Perseverance (persecuted for righteousness), and Glorification (reviled and blessed). The Beatitudes also serve as a table of contents for the entire Sermon on the Mount in reverse chiastic order, linking each blessing to a corresponding teaching in the sermon. God\'s prophetic plan, the article argues, was to unveil each doctrine of salvation with power in a specific historical era, delivering to the church its nine blessings in sequence — with one last blessing (glorification) yet to come.', href:'the-beatitudes.html'},
  {title:'The Childbearing', sub:'', synopsis:'This article tackles the most theologically vexed verse in the women\'s ordination debate — 1 Timothy 2:15, \'But she will be saved through The Childbearing\' — by surveying dozens of English translations to expose the translators\' own uncertainty about who is being born and who is doing the saving. Three candidate identities for the child emerge from the translations: ordinary babies, the Christ child, or a figurative birth of something else entirely. The author argues for the third interpretation: The Childbearing is a singular redemptive event — the Protestant Reformation — whose birth pangs transformed the status of women in the church and Western civilization over five subsequent centuries. The peculiar grammar of the verse (she singular being saved by what they plural do) is a key clue that this is not about individual women surviving childbirth but about a corporate act that saves a collective group. This article sets up the detailed historical and prophetic argument developed in the subsequent articles of the women\'s ordination series.', href:'the-childbearing.html'},
  {title:'The End Times', sub:'', synopsis:'This article introduces Fractal Historicism — the original system of eschatology developed by the author and explored throughout the website — which applies the Growth and Harvest Patterns of biblical prophecy like fractals at multiple timescales, from the span of all history to the shorter spans of Israel\'s and the Church\'s development. The system stands in the tradition of classical Historicism (favored by Luther, Calvin, Wesley, and other Reformers), which matches biblical prophecy to actual historical events, but departs from earlier Historicism by not identifying the Pope as the Antichrist and by recognizing that the same prophetic patterns repeat at different scales. The article surveys all the end-times topics covered on the website — the seven cycles of judgment, the millennial kingdom, the four horsemen, the industrial-revolution era of the fifth trumpet, the coming fifth seal, and the mystery of the seven thunders. A diagram comparing Fractal Historicism to competing eschatological systems (Preterism, Futurism, and Idealism) orients the reader to how this system relates to other common approaches.', href:'the-end-times.html'},
  {title:'The Fifth Seal', sub:'', synopsis:'This article argues that the coming opening of the Fifth Seal of Revelation will trigger a global persecution of Christians that separates the faithful from the unbelieving world, plunging non-Christians into a worldwide plague of darkness analogous to Egypt\'s ninth plague. Five converging prophetic themes — Solomon\'s time to hate, the fifth seal, the Exodus plague of darkness, the ninth commandment against lying, and the tenth commandment against covetousness — all point to the same near-future era, as established by the prophetic clocks analyzed in the author\'s books. The unexpected silver lining is that even as the world darkens, God will be opening the minds of the faithful to see marvelous new truths hidden in Ecclesiastes (illuminated by the Spirit of Might) and eventually in Matthew. The article carefully distinguishes speculation about how the prophecy will be fulfilled from the confident claim that the biblical clocks have already identified the era in which it will occur.', href:'the-fifth-seal.html'},
  {title:'The Journey Pattern', sub:'', synopsis:'Matthew\'s genealogy of Jesus deliberately counts 42 generations — not 41 — from Abraham to Jesus by counting David twice, and this article argues that the number 42 is not a scribal error but a deliberate clue pointing to the Journey Pattern, the biblical framework governing the long human journey from expulsion from Eden back to the New Jerusalem. The number 42 connects to the 42 stations of Israel\'s wilderness journey in Numbers 33 and to the 42-month tribulation periods in Revelation, establishing 42 as the number of the journey itself. The article explores how God measures time in generations of people rather than abstract years, and how Matthew\'s genealogy encodes this framework as a table of contents for all of redemptive history. The Journey Pattern complements the Growth and Harvest Patterns by providing the overarching narrative arc — the long road back to Paradise — within which those other patterns operate.', href:'the-journey-pattern.html'},
  {title:'The Meaning of the Beasts of Job', sub:'', synopsis:'This article, the second part of a two-chapter analysis of Job as a prophetic empire clock, reveals that God judged each empire identified in Job for breaking a specific commandment — and that these judgments proceed in the same sequence as the commandments listed in Exodus 20. The friends\' speeches in Job, condemned by God as wrong about Job personally, are shown to function as \'negative theology\': inverted, they reveal truths about oppressive civilizations and their eventual divine punishment. A key structural insight is that Job\'s descent-to-the-grave passage (Job 17) appears immediately before Job\'s resurrection cry (\'I know that my Redeemer lives!\' in Job 19), mirroring the historical sequence of Babylonian exile followed by Persian restoration under Cyrus — showing that the history of empires is intimately woven into the plan of salvation. The article builds on \'Job: The Course of Empires\' and together they form a complete two-chapter portrait of Job as the Bible\'s most comprehensive prophetic framework for world history.', href:'the-meaning-of-the-beasts-of-job.html'},
  {title:'The Millennial Kingdom', sub:'', synopsis:'This article argues from multiple converging prophetic clocks that the Millennial Kingdom of Christ began in 380 AD — when the Edict of Thessalonica made Christianity the official state religion of Rome, effectively binding Satan\'s power to openly deceive the nations — and ended approximately 1,000 years later in 1380 AD, when Satan was released. The first resurrection of Revelation 20 is interpreted as a non-visible, heavenly event: martyrs reigning with Christ in heaven, not a physical raising of bodies on earth — a reading that avoids the chronological impossibility of a literal future millennium extending history beyond 7,000 years. The article works backwards from the present and forwards from the Creation, cross-referencing multiple Fractal Historicism prophetic clocks to narrow down the millennium\'s dates. Interpreting the text through the lens of what Satan was doing — when was he most constrained, when most unleashed — proved to be the unexpected analytical key that unlocked the passage.', href:'the-millennial-kingdom.html'},
  {title:'The Motherhood Pattern', sub:'', synopsis:'This article discovers a Motherhood Pattern encoded throughout Scripture, showing that God uses the female experience — birth, puberty, marriage, conception, childbirth, and death — as a template for structuring both history and prophecy. The article matches six major civilizations to the stages of a woman\'s life, showing that each civilization lived through analogous phases, though only five delivered \'babies\' into the stream of history. A second major section surveys the spirit-filled women of the Old Testament — from Sarah to Miriam to Rahab — and demonstrates that each exemplified a particular Spirit of God from Isaiah 11, providing a female-centered witness to the seven spirits. A final section addresses practical questions: what the Bible teaches about children\'s education, the appropriate age for marriage, and how Job\'s story functions as a parable of women\'s suffering and ultimate vindication.', href:'the-motherhood-pattern.html'},
  {title:'The Righteous Fall Seven Times', sub:'', synopsis:'Proverbs 24:16 — \'for the righteous falls seven times and rises again\' — was the verse that inspired the author to study Job as a model of resilience after personal crisis, and this article explores how that verse unlocked both the structure of Job and deeper truths about how God trains people to endure suffering. The article introduces the concept of Emotional Riddles — biblical passages that repel the reader with apparent sexism, racism, or divine unfairness before yielding unexpected wisdom to those who wrestle with them long enough. Drawing parallels between Proverbs 24 (matched to Ecclesiastes 3\'s \'time to tear\'), Job 5:19 (\'from six calamities he will rescue you; in seven no harm will touch you\'), and the author\'s own experience of parental grief, it shows that seven is not merely a number but the shape of perseverance itself. The article sets the stage for deeper study of Job as the Bible\'s supreme portrait of resilient faith.', href:'the-righteous-fall-seven-times.html'},
  {title:'The Theme of Books in the Pillars of Wisdom', sub:'', synopsis:'This article examines the theme of books running through the Seven Pillars of Wisdom — Psalms, Job, Proverbs, Song of Songs, Ecclesiastes, Matthew, and Revelation — as part of the larger project of demonstrating that these seven books form a coherent, intentionally designed unit. Beginning from Solomon\'s two bronze temple pillars (Jachin meaning \'he establishes\' and Boaz meaning \'in him is strength\'), it demonstrates that pillars have a dual nature: strength for navigating today and establishment across time, mapping respectively to the Harvest Pattern and the Growth Pattern. The article explains why the Pentateuch (especially Exodus) serves as the floor of Lady Wisdom\'s house rather than one of its pillars, grounding the entire structure in the Law and in the lapis lazuli pavement beneath God\'s feet. An analysis of how each pillar book references and honors the Books of Moses reveals the deep structural unity woven into the entire biblical canon.', href:'theme-of-books.html'},
  {title:'The Theme of Pillars in the Pillars of Wisdom', sub:'', synopsis:'This article traces the recurring theme of pillars through each of the Seven Pillars of Wisdom, demonstrating that the seven books form a unified architectural whole in which each pillar book actually discusses pillars as a metaphor for the qualities of wisdom. Beginning with Proverbs (which names and numbers the seven pillars in chapter 9 and lists all seven Spirits of God in chapter 8) and moving through Psalms (including Psalms 75, 99, and 144 on strength and establishment), the article builds the case that both principal attributes of pillars — strength for today and establishment across time — appear consistently across all seven books. The connections between Psalm 144\'s prayer for sons strong as plants and daughters beautiful as corner pillars and Revelation\'s promise to the church of Philadelphia show how the pillar imagery threads from the psalms all the way to the end of the Bible. This article is part of \'Appendix H: Clues to the Seven Pillars,\' which assembles the cumulative case that the seven books were designed to function as a unity.', href:'theme-of-pillars.html'},
  {title:'The Theme of Songs in the Pillars of Wisdom', sub:'', synopsis:'This article traces the recurring theme of songs and singing through the Seven Pillars of Wisdom, finding that the pillar books are full of song as both sorrow and celebration — and that the mark of wisdom is knowing which kind of song the present moment calls for, or whether to remain silent. A striking observation is that Jesus quoted the Psalms more than any other Old Testament book, indicating that the Psalms occupy the pinnacle of the worship tradition; through worship we both come to understand God and discover that God understands us, making Psalms the home of the Spirit of Understanding. The article traces songs of darkness and dawn, harvest and exile, across Psalms, Job, Song of Songs, and Revelation, weaving them into a single argument that song is the primary language of wisdom. This is one of seven theme articles that together constitute the cumulative proof that the Seven Pillars of Wisdom are a deliberate, unified biblical set.', href:'theme-of-songs.html'},
  {title:'The Theme of Spirits in the Pillars of Wisdom', sub:'', synopsis:'This article examines how each of the Seven Pillars of Wisdom exemplifies one of the Seven Spirits of God named in Isaiah 11:2 — the Spirit of the Lord, Wisdom, Understanding, Counsel, Might, Knowledge, and the Fear of the Lord — while all seven spirits appear in every book. The analysis shows that the Psalms, with \'the LORD\' appearing 717 times (and 24 times in Psalm 119 alone), are unmistakably the book of the Spirit of Lordship; Job\'s great hymn to wisdom in chapter 28 makes it the book of the Spirit of Wisdom; and each remaining pillar book is matched to one spirit by equally compelling textual evidence. The article demonstrates that Jesus is specially associated with both the Spirit of Wisdom and the Spirit of Knowledge — a theological insight with deep implications for Christology. This is one of seven theme articles that together constitute the cumulative proof that the Seven Pillars of Wisdom are a deliberate, unified biblical set.', href:'theme-of-spirits.html'},
  {title:'The Theme of Swords in the Pillars of Wisdom', sub:'', synopsis:'This article traces the theme of swords through the Seven Pillars of Wisdom, finding in sword imagery a thread connecting the Psalms\' prophetic cries (including Psalm 22, Jesus\' only Bible quotation from the cross) to Job\'s portrayal of divine judgment to the two-edged sword of the risen Christ in Revelation. In Psalms, seven of the nineteen sword occurrences use the sword as an analogy for speech, and seven are explicitly prophetic; in Job, the sword moves from literal slaughter in the opening chapter to the metaphysical limit at the end — no sword can subdue Leviathan, only eternal destruction. A personal reflection on waking in the night consumed with rage, tempted to wield God\'s own sword against the wicked, illustrates how even the most even-tempered reader is drawn into Job\'s more wrathful moods. This is one of seven theme articles assembling the cumulative proof that the Seven Pillars of Wisdom form a deliberate, unified biblical unit.', href:'theme-of-swords.html'},
  {title:'The Theme of Thunders in the Pillars of Wisdom', sub:'', synopsis:'This article traces the theme of thunders through the Seven Pillars of Wisdom and their connections to Exodus, revealing how the seven thunders of Revelation are foreshadowed in Psalms, Job, and the Sinai theophany — and how these cross-connections anchor the pillars to the Mosaic foundation. A sweeping cross-reference chart connects over a dozen passage pairs spanning Psalms, Revelation, Job, and Exodus, showing that the same images (thunder, lightning, fire, sea monsters, the lamb) appear across all of these books in deliberate parallel. Jeremiah\'s seven analogies for God speaking — roar, thunder, roar mightily, shout, shout, and bring charges — are shown to evoke the seven thunders, while also connecting to the theme of swords. The article culminates with a return to the rainbow of Revelation 10, which ties together pillars, thunders, spirits, and the theme of books in a single convergent vision.', href:'theme-of-thunders.html'},
  {title:'The Theme of Treasure in the Pillars of Wisdom', sub:'', synopsis:'This article examines the theme of treasure running through the Seven Pillars of Wisdom, arguing that the tension between true and false treasure is the organizing metaphor for all genuine worship: treasuring what God treasures is worship, while treasuring the impermanent or unclean is idolatry. Beginning with Psalm 115\'s devastating portrait of idols — made of silver and gold but unable to see, hear, smell, or speak — it connects treasure language to all the healing miracles of Jesus (who undid precisely the disabilities the psalm describes) and notes that \'the LORD\' appears twelve times in that one psalm, linking treasure and lordship. The analysis proceeds through Job, Proverbs, Song of Songs, Ecclesiastes, Matthew, and Revelation, tracing the true-versus-false-treasure dialectic in each. As a capstone article in the series, it also derives insights from all seven themes together and explains why Jesus is specially associated with both the Spirit of Wisdom and the Spirit of Knowledge.', href:'theme-of-treasures.html'},
  {title:'There is a Season', sub:'', synopsis:'This article explores the 28 times of Ecclesiastes 3 — \'A time to be born, and a time to die; a time to plant, and a time to pluck up...\' — discovering in them the Growth Pattern, a prophetic framework that governs not only the life of an individual but the arc of civilization and world history. Originally published as a chapter in *Peace, like Solomon Never Knew*, the article connects the 28 times to the Five Factor Model of personality (OCEAN), showing that each phase of growth corresponds to a personality trait being formed or tested. The paired contrasts of the poem (wet vs. dry season, planting vs. harvesting, tearing vs. sewing) are decoded as a table of contents for all of Ecclesiastes, with the recurring phrase \'under the sun\' serving as a structural marker dividing the book into 28 sections. The realization that God measures human history in the same rhythms as a single human life gives the poem a grandeur that far exceeds its brevity.', href:'there-is-a-season.html'},
  {title:'Timeless?', sub:'', synopsis:'This article surveys the \'empire clocks\' embedded in Daniel, Revelation, and other prophetic books, explaining how they reveal the sequence and character of the major world empires without providing precise dates — making them \'timeless\' clocks, qualitative rather than quantitative. The article introduces Ellis Skolfield\'s rule for identifying which empires belong to the master sequence: only those that captured Jerusalem qualify, a test that filters the many candidates down to the handful Scripture emphasizes. Using the analogy of dendrochronology (matching tree rings to reconstruct ancient climates), the article shows how overlapping prophecies from different books can be aligned to build a composite picture of the full sweep of empire from Babylon to the final kingdom. The article is drawn from the chapter \'Timeless?\' in *Peace, like Solomon Never Knew*.', href:'timeless.html'},
  {title:'To Number our Days', sub:'', synopsis:'Psalm 90:12 asks God to \'teach us to number our days, that we may gain a heart of wisdom,\' and this article takes that request seriously — establishing ten rules for interpreting numbers in Scripture without falling into the traps of numerology or wishful pattern-matching. The author, an MIT-trained physicist, brings scientific skepticism to biblical number interpretation: he debunks the popular claim that the word \'lamb\' appears 28 times in the Bible, demonstrates the complexity of counting across translations, and insists that numbers should suggest associations rather than prove them. The article then introduces the key numbers that recur throughout the website\'s prophetic analysis — 7, 10, 12, 14, 28, 42, and others — situating them within their biblical contexts and explaining the rules that govern valid interpretation. It is drawn from the chapter \'To Number our Days\' in *Peace, like Solomon Never Knew* and serves as an essential methodological preface to all the prophetic clock analysis on the website.', href:'to-number-our-days.html'},
  {title:'Twice a Thousand Years', sub:'', synopsis:'This article tells the story of how the author discovered and decoded the master riddle of Ecclesiastes — a riddle in chapter 6 about a man who would rather not live \'twice a thousand years\' in joyless futility — which turned out to be the key that unlocked the entire prophetic structure of the book. The discovery process spanned a decade and proceeded in nine steps: decoding the 28 times as stages of human growth, recognizing \'under the sun\' as structural punctuation dividing the book into 28 sections, identifying the riddle\'s position in time, discovering that the same pattern operates fractally at multiple scales (one life, modern Israel, Judeo-Christian civilization, all of humanity), and connecting the 28 times to the Seven Pillars of Wisdom. The article presents a summary of the Growth Pattern\'s derivation that is both intellectually rigorous and personally moving, drawn from *Peace, like Solomon Never Knew* and *Plague, Precept, Prophet, Peace*. Like Omar Khayyam\'s Rubaiyat, it is about the seven gates one must pass through to sit upon wisdom\'s throne.', href:'twice-a-thousand-years.html'},
  {title:'Two Patterns in History', sub:'', synopsis:'This article traces the Journey Pattern — the 42-generation structure spanning all of human history from Adam\'s expulsion from Eden to Christ\'s return — by examining key events at symmetric pairs of generations and showing that God has structured all of history as a chiasm, a grand poetic palindrome. Generation 1 (Eden\'s expulsion) is matched by generation 42 (Christ\'s return); generation 7 (Abraham\'s near-sacrifice of Isaac on Moriah) is matched by generation 35 (the Ottoman capture of Jerusalem); generation 14 (David\'s capture of Jerusalem) is matched by generation 28 — and so on, with temple building, breaking, and rebuilding as the central recurring theme. The symmetry reveals that Jerusalem is the axis around which all 42 generations pivot, and that history\'s apparent chaos resolves into a majestic pattern when viewed at the scale God intended. The article demonstrates that the two great patterns of history — the Growth Pattern and the Journey Pattern — together explain both the inner development and the outer narrative of all civilization.', href:'two-patterns-in-history.html'},
  {title:'Types of Prophetic Clock', sub:'', synopsis:'This article catalogs the major types of prophetic clock found in the Bible, derived from a careful reading of Ecclesiastes 1, where the author discovered that Solomon had encoded a taxonomy of prophetic patterns in the very opening chapter of his wisdom book. The types include the Cosmic Chiasm (history proceeding in one sequence then repeating in reverse — the \'last in, first out\' pattern), plus four others drawn from Ecclesiastes 1\'s imagery of the sun, wind, rivers, and the deep. A key methodological point: the author refused to proceed without biblical warrant for the very idea that such patterns exist, prayed for confirmation, and returned to the text — which then yielded its secrets. The article is drawn from the chapter \'Solomon\'s Clocks: Ecclesiastes 1\' in *Peace, like Solomon Never Knew* and provides the theoretical foundation for all the prophetic clock analysis throughout the website.', href:'types-of-clock.html'},
  {title:'Parable of the Workers in the Vineyard', sub:'', synopsis:'Jesus\' Parable of the Workers in the Vineyard (Matthew 20:1-16) — in which workers hired at different hours of the day all receive the same pay — turns out to encode a detailed prophetic timeline of the five major waves of Christian missionary activity across history, with each hour of the workday corresponding to a distinct era of missions. The article, drawn from \'A Minute Look at Matthew\' in *Peace, like Solomon Never Knew*, is part of a larger analysis showing that Matthew contains at least seventeen instances of the Harvest Pattern and that several parables function as miniature prophetic clocks. When read alongside the Parable of the Talents (church growth), the Parable of the Ten Virgins (role of women), Psalm 107 (geographic direction), and the Parable of the Wedding Feast (condition of missionaries), the Vineyard Parable completes a five-way system that gives a remarkably precise picture of the entire history of Christian missions. The discovery that even the hour of each group\'s hiring encodes a specific historical date makes this one of the most precisely prophetic parables in Matthew.', href:'vineyard-parable.html'},
  {title:'The Parable of the Wedding Feast', sub:'Matthew 22:1-10', synopsis:'Jesus\' Parable of the Wedding Feast (Matthew 22:1-10) — in which a king\'s servants invite guests to his son\'s wedding, are rejected and killed, and the feast is filled from the roads instead — is decoded as a prophetic history of the fate of Christian missionaries across five major eras, answering the question: what happened to the men and women who left everything to carry the Gospel to the world? The article situates the Parable of the Wedding Feast within a five-parable system in which each parable illuminates a different aspect of the church\'s missionary task: timeline, growth plan, role of women, geographic direction, and the condition of the missionaries themselves. The disturbing detail — that the king \'sent his troops and destroyed those murderers and burned their city\' — is shown to be a literal prophecy about the Roman destruction of Jerusalem in 70 AD, marking the end of the first missionary era. Together, the five parables form one of the most detailed prophetic pictures of church history anywhere in the New Testament.', href:'wedding-parable.html'},
  {title:'Which Ten Commandments?', sub:'', synopsis:'This article defines the Law Pattern — the structural framework underlying the Ten Commandments — and addresses a surprising complication: Jews, Catholics, and Orthodox/Reformed Christians parse the commandments into ten in three different ways, and only one of those ways (the Orthodox/Reformed division) preserves the prophetic structure that matches the Ten Plagues of Egypt to cycles of divine judgment against successive civilizations. The article examines Augustine\'s division (which combines the first two commandments and splits coveting into two), the Jewish division (which treats the preamble as the first commandment), and the Orthodox/Reformed division, showing why the prophetic pattern only works with the last of the three. The Law Pattern reveals that the commandments are structured according to the Trinity and that the Word of God is both divine and human, eternal and living in time. In its original context this chapter followed analysis of how God judged Persia, Greece, and Rome for breaking specific commandments — making the theological stakes of the parsing question concrete and urgent.', href:'which-ten-commandments.html'},
  {title:'The Yoke of Jesus', sub:'', synopsis:'This article argues that when Jesus says \'Take my yoke upon you\' in Matthew 11:29, the yoke he describes is not merely his teaching or his law but specifically the Holy Spirit — and that this identification unlocks the entire flow of Matthew 11-12, which moves from Jesus\' invitation to rest, through healings on the Sabbath, through controversy about Sabbath observance, to the climactic warning against blaspheming the Holy Spirit. The article demonstrates the technique of \'deconstructing the Holy Spirit\' — showing how both Matthew 11 and Ephesians 1:15-23 enumerate all seven Spirits of God from Isaiah 11 in sequence without naming the Spirit explicitly, a technique that invites careful readers to reconstruct the Spirit\'s presence from the surrounding details. All seven spirits are identified in the Ephesians passage with detailed textual support, proving the technique is deliberate and that Jesus\' \'yoke\' passage centers on the Spirit of Might, which brings rest from heavy burdens. The article is an excerpt from an upcoming book on the many ways to speak with God.', href:'yoke-of-jesus.html'}
];

/* ---- Fisher-Yates shuffle ---- */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---- build tiles ---- */
function buildTiles(articles) {
  const track = document.getElementById("track");
  track.innerHTML = "";
  articles.forEach((art, i) => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = art.href;
    a.setAttribute("role", "listitem");
    a.dataset.index = i;

    const titleEl = document.createElement("div");
    titleEl.className = "tile-title";
    titleEl.textContent = art.title;
    a.appendChild(titleEl);

    if (art.sub) {
      const subEl = document.createElement("div");
      subEl.className = "tile-sub";
      subEl.textContent = art.sub;
      a.appendChild(subEl);
    }

    const synEl = document.createElement("div");
    synEl.className = "tile-synopsis";
    synEl.textContent = art.synopsis;
    a.appendChild(synEl);

    track.appendChild(a);
  });
}

/* ---- build pip strip ---- */
function buildPips(count) {
  const strip = document.getElementById("pipStrip");
  strip.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const d = document.createElement("div");
    d.className = "pip";
    strip.appendChild(d);
  }
}

function updatePip(idx) {
  document.querySelectorAll(".pip").forEach((p, i) => p.classList.toggle("active", i === idx));
}

/* ============================================================
   Carousel engine
   ============================================================ */
(function () {
  const articles = shuffle([...ARTICLES]);
  buildTiles(articles);
  buildPips(articles.length);

  const track   = document.getElementById("track");
  const badge   = document.getElementById("pauseBadge");
  const wrapper = document.getElementById("carouselWrapper");

  /* ---- axis helpers ---- */
  const isPortrait = () => (window.innerWidth / window.innerHeight) < (3 / 4);

  /* Total scrollable distance: how far the track extends past the viewport */
  function getScrollMax() {
    return isPortrait()
      ? Math.max(0, track.scrollHeight - wrapper.clientHeight)
      : Math.max(0, track.scrollWidth  - wrapper.clientWidth);
  }

  /* Move the track with CSS transform — reliable on all browsers including iOS Safari.
     Using scrollLeft/scrollTop on overflow:hidden elements is unreliable on iOS. */
  function applyPos(px) {
    const max  = getScrollMax();
    currentPos = Math.max(0, Math.min(px, max));
    if (isPortrait()) {
      track.style.transform = `translateY(-${currentPos}px)`;
    } else {
      track.style.transform = `translateX(-${currentPos}px)`;
    }
    const frac   = max > 0 ? currentPos / max : 0;
    const pipIdx = Math.round(frac * (articles.length - 1));
    updatePip(pipIdx);
  }

  /* ---- state ---- */
  let paused         = false;
  let idleTimer      = null;
  let animFrameId    = null;
  let lastTimestamp  = null;
  let accumulated    = 0;
  let currentPos     = 0;
  let pauseCountdown = 0;
  let inPause        = false;
  let prevPortrait   = isPortrait();

  /* ---- pause / resume ---- */
  function showBadge() { badge.classList.add("visible"); }
  function hideBadge() { badge.classList.remove("visible"); }

  function pauseAuto() {
    paused        = true;
    lastTimestamp = null;
    showBadge();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(resumeAuto, RESUME_IDLE_MS);
  }

  function resumeAuto() {
    paused        = false;
    inPause       = false;
    lastTimestamp = null;
    hideBadge();
    clearTimeout(idleTimer);
  }

  /* ---- animation loop ---- */
  function animate(ts) {
    animFrameId = requestAnimationFrame(animate);
    if (paused) { lastTimestamp = null; return; }
    if (lastTimestamp === null) { lastTimestamp = ts; return; }

    const delta = ts - lastTimestamp;
    lastTimestamp = ts;

    if (inPause) {
      pauseCountdown -= delta;
      if (pauseCountdown <= 0) inPause = false;
      return;
    }

    accumulated += SCROLL_SPEED * (delta / 1000);
    if (accumulated >= 1) {
      const step = Math.floor(accumulated);
      accumulated -= step;
      const max = getScrollMax();
      if (max <= 0) { accumulated = 0; return; }  /* layout not ready */
      const newPos = currentPos + step;
      if (newPos >= max) {
        /* Reached end — jump back to start with a pause */
        applyPos(0);
        inPause        = true;
        pauseCountdown = SCROLL_PAUSE_MS;
      } else {
        applyPos(newPos);
        /* Brief pause every ~300 px so each tile is readable */
        if (Math.floor(newPos / 300) > Math.floor((newPos - step) / 300)) {
          inPause        = true;
          pauseCountdown = SCROLL_PAUSE_MS;
        }
      }
    }
  }

  /* ---- drag / touch ---- */
  let dragStartClient = 0;
  let dragStartPos    = 0;
  let isDragging      = false;
  let dragMoved       = false;

  /* Return the scroll-axis coordinate from any pointer or touch event */
  function getCoord(e) {
    const src = (e.touches && e.touches.length > 0)
               ? e.touches[0]
               : (e.changedTouches && e.changedTouches.length > 0)
               ? e.changedTouches[0]
               : e;
    return isPortrait() ? src.clientY : src.clientX;
  }

  function onPointerDown(e) {
    if (e.type === "mousedown" && e.button !== 0) return;
    dragStartClient = getCoord(e);
    dragStartPos    = currentPos;
    isDragging      = true;
    dragMoved       = false;
    paused          = true;
    lastTimestamp   = null;
    showBadge();
    clearTimeout(idleTimer);
    /* Auto-resume if the user doesn't drag or navigate within idle timeout */
    idleTimer = setTimeout(resumeAuto, RESUME_IDLE_MS);
    /* Block text-selection on mouse drag; do NOT preventDefault for touch
       so the browser can still synthesise click/tap events for short taps */
    if (e.type === "mousedown") e.preventDefault();
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    const coord = getCoord(e);
    const diff  = dragStartClient - coord;
    if (Math.abs(diff) > 6) {
      dragMoved = true;
      /* Now confirmed drag — prevent native scroll / page pan */
      e.preventDefault();
    }
    if (dragMoved) {
      applyPos(dragStartPos + diff);
      /* Reset idle timer while dragging */
      clearTimeout(idleTimer);
      idleTimer = setTimeout(resumeAuto, RESUME_IDLE_MS);
    }
  }

  function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    /* idleTimer is already running and will auto-resume */
  }

  /* Mouse */
  track.addEventListener("mousedown",  onPointerDown, { passive: false });
  window.addEventListener("mousemove", onPointerMove);
  window.addEventListener("mouseup",   onPointerUp);

  /* Touch — touchstart is passive so the browser handles taps normally;
     only touchmove calls preventDefault (after drag threshold is exceeded) */
  track.addEventListener("touchstart", onPointerDown, { passive: true });
  track.addEventListener("touchmove",  onPointerMove, { passive: false });
  track.addEventListener("touchend",   onPointerUp);

  /* Hover: pause on enter, resume on leave (mouse only) */
  track.addEventListener("mouseenter", () => { if (!isDragging) pauseAuto(); });
  track.addEventListener("mouseleave", () => { if (!isDragging) resumeAuto(); });

  /* Click: block navigation only when a real drag just occurred */
  track.addEventListener("click", (e) => {
    if (dragMoved) e.preventDefault();
  });

  /* Orientation / resize: reset scroll position when portrait<->landscape flips */
  window.addEventListener("resize", () => {
    const nowPortrait = isPortrait();
    if (nowPortrait !== prevPortrait) {
      prevPortrait          = nowPortrait;
      currentPos            = 0;
      accumulated           = 0;
      inPause               = false;
      track.style.transform = "";
    }
    applyPos(currentPos);
  });

  /* bfcache: when the user presses Back to return to this page,
     resume scrolling immediately rather than staying paused */
  window.addEventListener("pageshow", (e) => {
    if (e.persisted) resumeAuto();
  });

  /* Kick off */
  animate(performance.now());
})();
</script>
</body>
</html>
